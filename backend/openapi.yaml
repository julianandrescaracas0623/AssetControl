      operationId: plataformaCambiarEstadoEmpresa
      summary: Desactivar o reactivar una empresa (idempotente; no borra nada)
      description: >-
        Desactivada, sus usuarios no inician sesión, no renuevan la sesión y sus tokens
        vigentes dan 401; reactivarla restaura el acceso.
      security:
        - plataformaAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstadoEmpresaBody" }
      responses:
        "200":
          description: Estado resultante.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoEmpresa" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /plataforma/empresas/{id}/usuarios:
    get:
      tags: [plataforma]
      operationId: plataformaListarUsuarios
      summary: Usuarios de una empresa con su rol y el estado de su membresía (módulo Usuarios)
      description: >-
        Una fila por membresía: id del usuario, nombre, correo, rol, si la membresía está
        activa y si el cambio de contraseña sigue pendiente. Nunca hash, token ni datos de
        negocio.
      security:
        - plataformaAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Usuarios de la empresa, por nombre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaUsuariosPlataforma" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /plataforma/empresas/{id}/usuarios/{usuario_id}:
    patch:
      tags: [plataforma]
      operationId: plataformaCambiarEstadoUsuario
      summary: Desactivar o reactivar la membresía de un usuario (idempotente; no borra nada)
      description: >-
        Cambia solo si la membresía está activa. Al desactivarla se revocan sus sesiones
        renovables y el usuario recibe 401 al entrar, al renovar y con su token vigente.
        No se puede desactivar al último admin activo ni cambiar usuarios de una empresa
        desactivada. Un usuario que no es de esa empresa da 404. Idempotente: repetir el
        estado actual responde 200 con ese estado, no cambia nada y no escribe auditoría
        (solo se audita un cambio real). Orden de los rechazos, y el primero que aplica es
        el que se responde, sin cambiar nada: (1) 404 si la empresa no existe; (2) 404 si
        el usuario no es de esa empresa; (3) 409 empresa_inactiva (en los dos sentidos);
        (4) 409 ultimo_admin (solo al desactivar; repetir la desactivación de un admin ya
        inactivo es idempotente y no da ultimo_admin). Si otro cambio de membresías de la
        misma empresa retiene su candado más de 5 s (lock_timeout), o la base aborta la
        transacción por interbloqueo o fallo de serialización, 503 servicio_no_disponible
        sin cambios; se puede reintentar.
      security:
        - plataformaAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: usuario_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstadoUsuarioBody" }
      responses:
        "200":
          description: Estado resultante de la membresía.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoUsuario" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: >-
            La empresa está desactivada (empresa_inactiva; primero se reactiva) o es el
            último admin activo de la empresa (ultimo_admin). Si aplican los dos, gana
            empresa_inactiva; un 404 va antes que ambos. No cambia nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [empresa_inactiva, ultimo_admin]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          description: >-
            No se pudo contar el intento (plat_accion), otro cambio de membresías de la
            misma empresa retuvo su candado más de 5 s (lock_timeout) o la base abortó la
            transacción (interbloqueo o fallo de serialización). No cambia nada.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar.
              required: true
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [servicio_no_disponible]
    put:
      tags: [plataforma]
      operationId: plataformaEditarUsuario
      summary: Editar el nombre y el rol de un usuario de una empresa (sin cambios, 200 sin escribir)
      description: >-
        Exactamente nombre y rol; cualquier otra clave (correo, contraseña, activa...) da
        400: el correo, la contraseña y el estado no se editan por esta ruta. El nombre se
        normaliza como el de cualquier usuario (máximo 120 caracteres) y el rol es admin o
        contador (422 con campo, sin cambios). Cambia solo el nombre del usuario (que es
        suyo en todas sus empresas) y el rol de su membresía en esta empresa, y escribe
        usuario_editado sin valores en la misma transacción. Si cambia el rol, se revocan
        las sesiones renovables de esa membresía: la persona vuelve a entrar con el rol
        nuevo, y su acceso vigente ya actúa con él (un admin degradado recibe 403 en su
        siguiente petición). Cambiar solo el nombre no cierra ninguna sesión. Si nada
        cambia, responde 200 sin escribir, revocar ni auditar. Una membresía desactivada se
        puede editar. Orden de los rechazos, sin cambiar nada: (1) 404 si la empresa no
        existe; (2) 404 si el usuario no es de esa empresa; (3) 409 empresa_inactiva; (4)
        409 ultimo_admin si quitaría el rol admin al último admin activo; (5) 503 si otro
        cambio de usuarios de la misma empresa retiene su candado más de 5 s. Cuenta en
        plat_accion antes de validar.
      security:
        - plataformaAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: usuario_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditarUsuarioBody" }
      responses:
        "200":
          description: El nombre y el rol resultantes (los mismos de antes si no cambió nada).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioEditado" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: >-
            La empresa está desactivada (empresa_inactiva) o el cambio quitaría el rol admin
            al último admin activo de la empresa (ultimo_admin). Si aplican los dos, gana
            empresa_inactiva; un 404 va antes que ambos. empresa_inactiva se evalúa con el
            estado serializado (bajo el candado por empresa): con el candado ocupado puede
            responderse 503 en su lugar. No cambia nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [empresa_inactiva, ultimo_admin]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: El nombre o el rol no son válidos (en campo, cuál). No cambia nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [campo_invalido]
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          description: >-
            No se pudo contar el intento (plat_accion), otro cambio de usuarios de la misma
            empresa retuvo su candado más de 5 s (lock_timeout) o la base abortó la
            transacción (interbloqueo o fallo de serialización). No cambia nada; se puede
            reintentar.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar.
              required: true
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [servicio_no_disponible]

  /plataforma/empresas/{id}/usuarios/{usuario_id}/contrasena:
    post:
      tags: [plataforma]
      operationId: plataformaRestablecerContrasenaUsuario
      summary: Definir una contraseña temporal para un usuario de una empresa (no idempotente)
      description: >-
        Exactamente password y password_confirmacion; cualquier otra clave da 400. La
        contraseña cumple la misma política que la del primer admin del alta (10 a 128
        caracteres y no común) y la confirmación se compara en el servidor (422 con campo,
        sin cambios). El servidor calcula el hash Argon2id y, en una sola transacción, guarda
        el hash, marca que la persona debe cambiarla al entrar, corta sus accesos vigentes
        (401 con el token anterior), revoca todas sus sesiones renovables en todas sus
        empresas y escribe usuario_contrasena_restablecida sin valores. Responde 204 sin
        cuerpo: la contraseña y su hash nunca se devuelven. Aplica a cualquier usuario de la
        empresa, también al único admin, a una membresía desactivada y a quien tiene
        membresías en otras empresas. Con el correo activo, tras confirmar el cambio se envía a
        la persona un aviso (sin la contraseña) con un enlace de un solo uso para elegir la suya
        (vence en 30 minutos); sin enlace si la cuenta no es elegible para la recuperación. El
        aviso nunca cambia la respuesta. Cada llamada válida define otra contraseña, revoca,
        audita y avisa de nuevo. Orden de los rechazos, sin cambiar nada: (1)
        404 si la empresa no existe; (2) 404 si el usuario no es de esa empresa (sin decir si
        existe en otra); (3) 409 empresa_inactiva; (4) 503 si otro cambio de usuarios de una
        de sus empresas retiene su candado más de 5 s. Cuenta en plat_accion antes de
        validar.
      security:
        - plataformaAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: usuario_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContrasenaTemporalBody" }
      responses:
        "204":
          description: Contraseña temporal definida; sin cuerpo.
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: >-
            La empresa está desactivada (empresa_inactiva; primero se reactiva). Un 404 va
            antes. empresa_inactiva se evalúa con el estado serializado (bajo el candado por
            empresa): con el candado ocupado puede responderse 503 en su lugar. No cambia nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [empresa_inactiva]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: >-
            La contraseña no cumple la política (contrasena_*, campo password) o la
            confirmación no coincide (contrasenas_distintas, campo password_confirmacion). No
            cambia nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos:
            - contrasena_invalida
            - contrasena_corta
            - contrasena_larga
            - contrasena_comun
            - contrasenas_distintas
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          description: >-
            No se pudo contar el intento (plat_accion), otro cambio de usuarios de una de las
            empresas de la persona retuvo su candado más de 5 s (lock_timeout) o la base
            abortó la transacción (interbloqueo o fallo de serialización). No cambia nada; se
            puede reintentar.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar.
              required: true
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [servicio_no_disponible]

  /plataforma/empresas/{id}/logo:
    post:
      tags: [plataforma]
      operationId: plataformaSubirLogoEmpresa
      summary: Subir o reemplazar el logo de una empresa (alta o edición de la empresa)
      description: >-
        multipart/form-data con exactamente logo_id (UUID canónico del cliente) y archivo,
        con las reglas de la spec 013: PNG, JPEG o WebP hasta 2 MB; se guarda en PNG ≤ 600
        px con transparencia y sin metadatos, en el almacén con la clave del tenant. En una
        transacción, con la ficha de la empresa bloqueada, registra el logo (subido por el
        admin de la empresa) y lo deja como vigente; si la empresa no tenía logo escribe
        empresa_logo_subido y, si tenía otro, lo reemplaza y escribe
        empresa_logo_reemplazado (201 en los dos casos). El logo anterior (fila y archivo)
        se conserva: los informes cerrados lo siguen usando. Si la transacción falla, el
        archivo nuevo se borra. Repetir con el logo_id vigente responde 200 sin cambiar
        nada. Cuenta en plat_accion antes de validar.
      security:
        - plataformaAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SubirLogoBody" }
      responses:
        "200":
          $ref: "#/components/responses/LogoPlataformaGuardado"
        "201":
          $ref: "#/components/responses/LogoPlataformaGuardado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: >-
            El logo_id ya se usó, en esta u otra empresa (logo_id_en_uso), el tenant no
            tiene sus datos de empresa (empresa_sin_datos) o no tiene ninguna membresía
            admin (empresa_sin_admin). No cambia nada ni deja archivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [logo_id_en_uso, empresa_sin_datos, empresa_sin_admin]
        "413":
          $ref: "#/components/responses/FotoDemasiadoGrande"
        "415":
          $ref: "#/components/responses/FotoTipoNoAdmitido"
        "422":
          $ref: "#/components/responses/FotoInvalida"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          description: >-
            El almacén de imágenes no está configurado (logos_no_disponibles; la empresa ya
            existe y el paso se puede saltar), no se pudo contar el intento (plat_accion), la
            ficha de la empresa siguió bloqueada más de 5 s (lock_timeout) o la base abortó
            la transacción (servicio_no_disponible, con Retry-After). No cambia nada ni deja
            archivo.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar (solo servicio_no_disponible).
              required: false
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [logos_no_disponibles, servicio_no_disponible]

  /plataforma/empresas/{id}/ficha:
    get:
      tags: [plataforma]
      operationId: plataformaLeerFichaEmpresa
      summary: Ficha vigente de una empresa, para editarla (módulo Empresas)
      description: >-
        Exactamente nombre, dirección, NIT, teléfono, correo y si tiene logo; nada más de
        la empresa (ni quién la actualizó ni el id del logo). Solo lectura: no cuenta en
        plat_accion ni escribe auditoría.
      security:
        - plataformaAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: La ficha vigente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FichaEmpresaPlataforma" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: >-
            El tenant no tiene sus datos de empresa (empresa_sin_datos; p. ej. creado por el
            comando create-tenant): los completa su admin desde su pantalla Empresa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [empresa_sin_datos]
    put:
      tags: [plataforma]
      operationId: plataformaEditarFichaEmpresa
      summary: Editar la ficha de una empresa (sin cambios, 200 sin escribir)
      description: >-
        Los cinco campos de la ficha, siempre todos (nit, telefono y correo pueden ser null
        o vacíos para quitarlos); cualquier otra clave da 400. Mismas validaciones que la
        pantalla Empresa de la clínica (422 con campo, sin cambios). Con la ficha
        bloqueada, cambia solo esas cinco columnas y la fecha de actualización (no quién
        la actualizó) y, si cambia el nombre, también el nombre de la empresa en la
        consola y en las listas; escribe empresa_editada sin valores en la misma
        transacción. Si ningún valor cambia, responde 200 sin escribir ni auditar. Los
        informes cerrados no cambian (guardan su copia de la empresa). Sin If-Match: si el
        admin edita a la vez, gana la última escritura. Se permite también con la empresa
        desactivada. Cuenta en plat_accion antes de validar.
      security:
        - plataformaAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FichaEmpresaPlataformaBody" }
      responses:
        "200":
          description: La ficha resultante (la misma de antes si no cambió nada).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FichaEmpresaPlataforma" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: >-
            El tenant no tiene sus datos de empresa (empresa_sin_datos); la consola no los
            crea. No cambia nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [empresa_sin_datos]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: Un dato de la ficha no es válido (en campo, cuál). No cambia nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [campo_invalido]
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          description: >-
            No se pudo contar el intento (plat_accion), la ficha de la empresa siguió
            bloqueada más de 5 s (lock_timeout) o la base abortó la transacción
            (interbloqueo o fallo de serialización). No cambia nada; se puede reintentar.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar.
              required: true
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [servicio_no_disponible]

  /plataforma/actividad:
    get:
      tags: [plataforma]
      operationId: plataformaActividad
      summary: Auditoría de la consola, de la más reciente a la más antigua (módulo Actividad)
      description: >-
        Solo lectura (consultarla no escribe auditoría). Paginada por cursor: se pide la
        primera página sin cursor y las siguientes con el siguiente de la anterior; el
        cursor es estable aunque lleguen registros nuevos. Orden por fecha y, a igual fecha,
        por id, los dos descendentes. Filtros opcionales y combinables: empresa, acción y
        rango de fechas (las dos inclusive, en la hora de Colombia, UTC−5). Por registro:
        id, fecha, acción, resultado, nombre del desarrollador («Operador» si la hizo el
        operador por CLI), id y nombre de la empresa (nulos si no aplica) e id del objeto.
        Los nombres se leen al consultar (no están en la auditoría). Nunca correos, IP,
        hashes ni texto libre. Cualquier otro parámetro, uno repetido o un valor fuera de
        formato da 400.
      security:
        - plataformaAuth: []
      parameters:
        - name: empresa_id
          in: query
          required: false
          description: Id de la empresa (UUID en minúsculas; no el UUID nulo).
          schema: { type: string, format: uuid }
        - name: accion
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AccionAuditoria" }
        - name: desde
          in: query
          required: false
          description: Primer día incluido (AAAA-MM-DD, hora de Colombia).
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: false
          description: Último día incluido (AAAA-MM-DD, hora de Colombia); no antes de desde.
          schema: { type: string, format: date }
        - name: limite
          in: query
          required: false
          description: Registros por página, de 1 a 100 (por defecto 50).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          required: false
          description: Valor opaco; el siguiente de la página anterior.
          schema: { type: string }
      responses:
        "200":
          description: Una página de la auditoría.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActividadPlataforma" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso (15 minutos). Guárdalo solo en memoria.
    plataformaAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token de acceso de plataforma (10 minutos; no sirve en las rutas de una clínica,
        ni el de una clínica aquí). Guárdalo solo en memoria.

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'row_version del activo leído, "3" o 3; si no coincide, 412.'
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      description: Un id de otro tenant responde 404, igual que uno inexistente.
      schema: { type: string, format: uuid }
    Csrf:
      name: X-AssetControl-CSRF
      in: header
      required: true
      description: Debe valer 1; además la petición debe venir del mismo sitio.
      schema: { type: string, const: "1" }
    RefreshCookie:
      name: refresh
      in: cookie
      required: false
      description: >-
        Cookie HttpOnly de refresh (__Secure-refresh fuera de desarrollo), Path=/auth.
      schema: { type: string }

    PlataformaRefreshCookie:
      name: plat-refresh
      in: cookie
      required: false
      description: >-
        Cookie HttpOnly de refresh de plataforma (__Secure-plat-refresh fuera de
        desarrollo), Path=/plataforma/auth; 8 horas.
      schema: { type: string }

  responses:
    SesionPlataformaIniciada:
      description: >-
        Sesión de plataforma emitida; deja la cookie de refresh de plataforma (HttpOnly,
        SameSite=Lax).
      headers:
        Set-Cookie:
          description: Cookie de refresh de plataforma nueva.
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SesionPlataforma" }
    SesionIniciada:
      description: Sesión emitida; deja la cookie de refresh (HttpOnly, SameSite=Lax).
      headers:
        Set-Cookie:
          description: Cookie de refresh nueva.
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Sesion" }
    SolicitudInvalida:
      description: El cuerpo no es JSON válido o le faltan campos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [solicitud_invalida]
    NoAutenticado:
      description: Sin sesión válida.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [no_autenticado]
    NoEncontrado:
      description: No existe en este tenant (o es de otro).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [no_encontrado]
    NombreDuplicado:
      description: Ya existe una con ese nombre (sin distinguir mayúsculas ni tildes).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [nombre_duplicado]
    Prohibido:
      description: Rol insuficiente o petición de otro sitio (sin cabecera CSRF).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [prohibido]
    ActivoDadoDeBaja:
      description: El activo está dado de baja; solo se puede reactivar.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [activo_dado_de_baja]
    FaltaVersion:
      description: Falta If-Match o no tiene la forma "N".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [falta_version]
    VersionDesactualizada:
      description: La versión no coincide; no se guardó nada. Trae el activo vigente con su foto.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VersionDesactualizada" }
      x-codigos: [version_desactualizada]
    ActivoCambiado:
      description: Guardado (o sin cambios); el activo con precio, foto y su versión.
      headers:
        ETag:
          description: La versión nueva entre comillas, para el próximo If-Match.
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ActivoRespuesta" }
    CuerpoDemasiadoGrande:
      description: El cuerpo supera 4 KB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [cuerpo_demasiado_grande]
    DemasiadasSolicitudes:
      description: Límite de tasa superado (igual exista o no la cuenta).
      headers:
        Retry-After:
          description: Segundos de la ventana del límite.
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [demasiadas_solicitudes]
    ServicioNoDisponible:
      description: >-
        No se pudo contar el intento, el servidor está saturado o el candado de membresías
        de la empresa sigue ocupado (un cambio de la consola en curso; espera máxima 3 s en
        login, refresh, aceptar invitación y cambio de contraseña). No cambia nada.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar.
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [servicio_no_disponible]

    FotoGuardada:
      description: La foto guardada (201 nueva; 200 si ya existía con ese foto_id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FotoRespuesta" }
    FotoDemasiadoGrande:
      description: La foto o el cuerpo superan el límite.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [imagen_demasiado_grande, cuerpo_demasiado_grande]
    FotoTipoNoAdmitido:
      description: El archivo no es JPEG, PNG ni WebP (se mira el contenido).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [tipo_no_admitido]
    FotoInvalida:
      description: La imagen está dañada o es demasiado grande en píxeles.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [imagen_invalida]
    FotosNoDisponibles:
      description: El almacenamiento de fotos no está configurado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [fotos_no_disponibles]
    EmpresaActual:
      description: Los datos de la empresa.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EmpresaRespuesta" }
    LogoPlataformaGuardado:
      description: >-
        El logo vigente de la empresa (201 nuevo o reemplazo; 200 si ya era el vigente con
        ese logo_id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogoPlataforma" }
    LogoGuardado:
      description: El logo guardado (201 nuevo; 200 si ya era el vigente con ese logo_id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogoRespuesta" }
    SinLogo:
      description: No hay logo (o es de otro tenant).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [sin_logo]

  schemas:
    ErrorCode:
      type: string
      description: Código estable del error; el texto para la persona va en message.
      enum:
        - solicitud_invalida
        - no_autenticado
        - prohibido
        - no_encontrado
        - metodo_no_permitido
        - cuerpo_demasiado_grande
        - tipo_no_soportado
        - error_http
