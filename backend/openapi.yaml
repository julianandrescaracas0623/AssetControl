      responses:
        "200":
          $ref: "#/components/responses/LogoGuardado"
        "201":
          $ref: "#/components/responses/LogoGuardado"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          description: Faltan los datos de la empresa o el logo_id ya se usó.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [empresa_sin_datos, logo_id_en_uso]
        "413":
          $ref: "#/components/responses/FotoDemasiadoGrande"
        "415":
          $ref: "#/components/responses/FotoTipoNoAdmitido"
        "422":
          $ref: "#/components/responses/FotoInvalida"
        "503":
          $ref: "#/components/responses/FotosNoDisponibles"
    delete:
      tags: [empresa]
      operationId: quitarLogo
      summary: Quitar el logo de la empresa (solo admin; el archivo se conserva)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: La empresa queda sin logo.
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/SinLogo"

  /empresa/logo/{id}:
    get:
      tags: [empresa]
      operationId: verLogo
      summary: El PNG de un logo del tenant, vigente o de un informe congelado (solo admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: El logo. Un logo nunca cambia (cambiarlo crea otro con otro id).
          headers:
            Cache-Control:
              required: true
              schema: { type: string, enum: ["private, max-age=86400"] }
            X-Content-Type-Options:
              required: true
              schema: { type: string, enum: [nosniff] }
          content:
            image/png:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/SinLogo"
        "503":
          $ref: "#/components/responses/FotosNoDisponibles"

  /valor-actual:
    get:
      tags: [activos]
      operationId: valorActual
      summary: Valor actual del inventario en vivo (solo admin; no es un informe)
      description: >-
        Suma en vivo de activo y en_reparacion (dado_de_baja no cuenta). Sigue los
        cambios al instante y nunca lee el desglose congelado de una sesión.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Total, unidades, valor en reparación y desglose con nombres actuales.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValorActual" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso (15 minutos). Guárdalo solo en memoria.

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'row_version del activo leído, "3" o 3; si no coincide, 412.'
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      description: Un id de otro tenant responde 404, igual que uno inexistente.
      schema: { type: string, format: uuid }
    Csrf:
      name: X-AssetControl-CSRF
      in: header
      required: true
      description: Debe valer 1; además la petición debe venir del mismo sitio.
      schema: { type: string, const: "1" }
    RefreshCookie:
      name: refresh
      in: cookie
      required: false
      description: >-
        Cookie HttpOnly de refresh (__Secure-refresh fuera de desarrollo), Path=/auth.
      schema: { type: string }

  responses:
    SesionIniciada:
      description: Sesión emitida; deja la cookie de refresh (HttpOnly, SameSite=Lax).
      headers:
        Set-Cookie:
          description: Cookie de refresh nueva.
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Sesion" }
    SolicitudInvalida:
      description: El cuerpo no es JSON válido o le faltan campos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [solicitud_invalida]
    NoAutenticado:
      description: Sin sesión válida.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [no_autenticado]
    NoEncontrado:
      description: No existe en este tenant (o es de otro).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [no_encontrado]
    NombreDuplicado:
      description: Ya existe una con ese nombre (sin distinguir mayúsculas ni tildes).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [nombre_duplicado]
    Prohibido:
      description: Rol insuficiente o petición de otro sitio (sin cabecera CSRF).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [prohibido]
    ActivoDadoDeBaja:
      description: El activo está dado de baja; solo se puede reactivar.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [activo_dado_de_baja]
    FaltaVersion:
      description: Falta If-Match o no tiene la forma "N".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [falta_version]
    VersionDesactualizada:
      description: La versión no coincide; no se guardó nada. Trae el activo vigente.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VersionDesactualizada" }
      x-codigos: [version_desactualizada]
    ActivoCambiado:
      description: Guardado (o sin cambios); el activo con precio y su versión.
      headers:
        ETag:
          description: La versión nueva entre comillas, para el próximo If-Match.
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ActivoRespuesta" }
    CuerpoDemasiadoGrande:
      description: El cuerpo supera 4 KB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [cuerpo_demasiado_grande]
    DemasiadasSolicitudes:
      description: Límite de tasa superado (igual exista o no la cuenta).
      headers:
        Retry-After:
          description: Segundos de la ventana del límite.
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [demasiadas_solicitudes]
    ServicioNoDisponible:
      description: No se pudo contar el intento o el servidor está saturado.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar.
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [servicio_no_disponible]

    FotoGuardada:
      description: La foto guardada (201 nueva; 200 si ya existía con ese foto_id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FotoRespuesta" }
    FotoDemasiadoGrande:
      description: La foto o el cuerpo superan el límite.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [imagen_demasiado_grande, cuerpo_demasiado_grande]
    FotoTipoNoAdmitido:
      description: El archivo no es JPEG, PNG ni WebP (se mira el contenido).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [tipo_no_admitido]
    FotoInvalida:
      description: La imagen está dañada o es demasiado grande en píxeles.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [imagen_invalida]
    FotosNoDisponibles:
      description: El almacenamiento de fotos no está configurado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [fotos_no_disponibles]
    EmpresaActual:
      description: Los datos de la empresa.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EmpresaRespuesta" }
    LogoGuardado:
      description: El logo guardado (201 nuevo; 200 si ya era el vigente con ese logo_id).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LogoRespuesta" }
    SinLogo:
      description: No hay logo (o es de otro tenant).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [sin_logo]

  schemas:
    ErrorCode:
      type: string
      description: Código estable del error; el texto para la persona va en message.
      enum:
        - solicitud_invalida
        - no_autenticado
        - prohibido
        - no_encontrado
        - metodo_no_permitido
        - cuerpo_demasiado_grande
        - tipo_no_soportado
        - error_http
        - error_interno
        - servicio_no_disponible
        - demasiadas_solicitudes
        - credenciales_invalidas
        - invitacion_invalida
        - contrasena_invalida
        - contrasena_corta
        - contrasena_larga
        - contrasena_comun
        - jerarquia_invalida
        - nombre_duplicado
        - tiene_hijas_activas
        - padre_inactivo
        - tiene_activos
        - codigo_invalido
        - precio_invalido
        - ubicacion_invalida
        - codigo_existente
        - falta_version
        - version_desactualizada
        - codigo_inmutable
        - activo_dado_de_baja
        - motivo_invalido
        - sesion_abierta_existente
        - sesion_cerrada
        - sesion_abierta
        - fotos_no_disponibles
        - sin_foto
        - foto_id_en_uso
        - empresa_sin_datos
        - sin_logo
        - logo_id_en_uso
        - foto_existente
        - imagen_demasiado_grande
        - tipo_no_admitido
        - imagen_invalida
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: Texto en español para mostrar. }
            request_id: { type: string, format: uuid }
            campo:
              type: string
              description: Campo del cuerpo que no es válido, cuando el error es de uno solo.

    Rol:
      type: string
      enum: [admin, contador]
    Usuario:
      type: object
      required: [id, email, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombre: { type: string }
    Tenant:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    UsuarioActual:
      type: object
      required: [usuario, tenant, rol]
      additionalProperties: false
      properties:
        usuario: { $ref: "#/components/schemas/Usuario" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        rol: { $ref: "#/components/schemas/Rol" }
    Sesion:
      type: object
      required: [access_token, token_type, expires_in, usuario, tenant, rol]
      additionalProperties: false
      properties:
        access_token: { type: string, description: JWT de acceso; solo en memoria. }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1, description: Segundos de vida del token. }
        usuario: { $ref: "#/components/schemas/Usuario" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        rol: { $ref: "#/components/schemas/Rol" }

    LoginBody:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string, format: password }
    InvitarBody:
      type: object
      required: [email, rol]
      additionalProperties: false
      properties:
        email: { type: string }
        rol: { $ref: "#/components/schemas/Rol" }
    ValidarBody:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: Token del fragmento del enlace. }
    AceptarBody:
      type: object
      required: [token, nombre, password]
      additionalProperties: false
      properties:
        token: { type: string }
        nombre:
          type: string
          maxLength: 120
          description: >-
            Nombre visible: se guarda en NFC y sin espacios en los extremos; necesita una
            letra o un número y no admite caracteres invisibles o de control.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128

    Invitacion:
      type: object
      required: [id, email, rol, expira_en]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        rol: { $ref: "#/components/schemas/Rol" }
        expira_en: { type: string, format: date-time }
    InvitacionCreada:
      type: object
      required: [invitacion, enlace]
      additionalProperties: false
      properties:
        invitacion: { $ref: "#/components/schemas/Invitacion" }
        enlace:
          type: string
          description: Ruta relativa /invitacion#<token>; se muestra una sola vez.
    Vigencia:
      type: object
      required: [vigente]
      additionalProperties: false
      properties:
        vigente: { type: boolean }

    NombreVisible:
      type: string
      maxLength: 120
      description: >-
        Se guarda en NFC y sin espacios en los extremos; necesita una letra o un número
        y no admite caracteres invisibles o de control.
    TipoUbicacion:
      type: string
      enum: [sede, sala, box]
    Ubicacion:
      type: object
      required: [id, nombre, tipo, padre_id, activa]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { $ref: "#/components/schemas/TipoUbicacion" }
        padre_id:
          type: [string, "null"]
          format: uuid
          description: Null solo en una sede.
        activa: { type: boolean }
    UbicacionRespuesta:
      type: object
      required: [ubicacion]
      additionalProperties: false
      properties:
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }
    ListaUbicaciones:
      type: object
      required: [ubicaciones]
      additionalProperties: false
      properties:
        ubicaciones:
          type: array
          items: { $ref: "#/components/schemas/Ubicacion" }
    CrearUbicacionBody:
      type: object
      required: [nombre, tipo]
      additionalProperties: false
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        tipo: { $ref: "#/components/schemas/TipoUbicacion" }
        padre_id:
          type: string
          format: uuid
          description: Obligatorio para sala (una sede) y box (una sala); prohibido en sede.
    ActualizarUbicacionBody:
      type: object
      additionalProperties: false
      description: Al menos uno de los dos campos.
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        activa: { type: boolean }

    Categoria:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    CategoriaRespuesta:
      type: object
      required: [categoria]
      additionalProperties: false
      properties:
        categoria: { $ref: "#/components/schemas/Categoria" }
    ListaCategorias:
      type: object
      required: [categorias]
      additionalProperties: false
      properties:
        categorias:
          type: array
          items: { $ref: "#/components/schemas/Categoria" }
    SugeridasCargadas:
      type: object
      required: [categorias, creadas]
      additionalProperties: false
      properties:
        categorias:
          type: array
          items: { $ref: "#/components/schemas/Categoria" }
        creadas: { type: integer, minimum: 0 }
    NombreBody:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }

    Precio:
      type: string
      description: >-
        Decimal en texto canónico ("1390000.50"), mayor o igual a 0 y con hasta dos
        decimales. Nunca un número JSON.
    EstadoActivo:
      type: string
      enum: [activo, en_reparacion, dado_de_baja]
    TextoOpcional:
      type: [string, "null"]
      maxLength: 120
    Activo:
      type: object
      required:
        [id, codigo, nombre, categoria, ubicacion, serial, marca, modelo, subtipo, fecha_compra, estado, row_version, creado_en]
      additionalProperties: false
      description: precio_compra solo existe en las respuestas al admin (P13).
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        ubicacion: { $ref: "#/components/schemas/UbicacionDeActivo" }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        marca: { $ref: "#/components/schemas/TextoOpcional" }
        modelo: { $ref: "#/components/schemas/TextoOpcional" }
        subtipo: { $ref: "#/components/schemas/TextoOpcional" }
        fecha_compra: { type: [string, "null"], format: date }
        estado: { $ref: "#/components/schemas/EstadoActivo" }
        row_version:
          type: integer
          minimum: 1
          description: Versión para If-Match al cambiar el activo (spec 005).
        creado_en: { type: string, format: date-time }
        precio_compra: { $ref: "#/components/schemas/Precio" }
        foto:
          description: Foto principal vigente; solo en la ficha y en por-codigo (spec 012).
          oneOf:
            - { $ref: "#/components/schemas/Foto" }
            - { type: "null" }
    Foto:
      type: object
      required: [id, creada_en, ancho, alto]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        creada_en: { type: string, format: date-time }
        ancho: { type: integer, minimum: 1 }
        alto: { type: integer, minimum: 1 }
    FotoRespuesta:
      type: object
      required: [foto]
      additionalProperties: false
      properties:
        foto: { $ref: "#/components/schemas/Foto" }
    SubirFotoBody:
      type: object
      required: [foto_id, archivo]
      additionalProperties: false
      properties:
        foto_id: { type: string, format: uuid }
        archivo: { type: string, description: "Archivo de imagen (binario)." }
    Empresa:
      type: object
      required: [nombre, direccion, nit, telefono, correo, logo, completa]
      additionalProperties: false
      properties:
        nombre: { type: string }
        direccion: { type: [string, "null"] }
        nit: { type: [string, "null"], description: "Con puntos y, si lo tiene, -dígito." }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"] }
        logo:
          oneOf:
            - type: "null"
            - type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
        completa: { type: boolean, description: "false hasta guardar nombre y dirección." }
    EmpresaDelInforme:
      type: object
      description: >-
        Datos de la empresa congelados al cerrar (spec 013). vigente true: la sesión se
        cerró antes de guardarlos y se muestran los de hoy.
      required: [nombre, direccion, nit, telefono, correo, logo, vigente]
      additionalProperties: false
      properties:
        nombre: { type: string }
        direccion: { type: [string, "null"] }
        nit: { type: [string, "null"] }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"] }
        logo:
          oneOf:
            - type: "null"
            - type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
        vigente: { type: boolean }
    EmpresaRespuesta:
      type: object
      required: [empresa]
      additionalProperties: false
      properties:
        empresa: { $ref: "#/components/schemas/Empresa" }
    GuardarEmpresaBody:
      type: object
      required: [nombre, direccion]
      additionalProperties: false
      properties:
        nombre: { type: string }
        direccion: { type: string }
        nit: { type: [string, "null"] }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"] }
    SubirLogoBody:
      type: object
      required: [logo_id, archivo]
      additionalProperties: false
      properties:
        logo_id: { type: string, format: uuid }
        archivo: { type: string, description: "Archivo de imagen (binario)." }
    LogoRespuesta:
      type: object
      required: [logo]
      additionalProperties: false
      properties:
        logo:
          type: object
          required: [id, ancho, alto]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            ancho: { type: integer }
            alto: { type: integer }
    UbicacionDeActivo:
      type: object
      required: [id, nombre, ruta]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        ruta: { type: string, description: '"Sala › Box" o el nombre de la sala.' }
    ListaActivos:
      type: object
      required: [activos, total, pagina, por_pagina]
      additionalProperties: false
      properties:
        activos:
          type: array
          items: { $ref: "#/components/schemas/Activo" }
        total: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 1 }
        por_pagina: { type: integer, minimum: 1 }
    Sugerencias:
      type: object
      required: [valores]
      additionalProperties: false
      properties:
        valores:
          type: array
          items: { type: string }
    ActivoRespuesta:
      type: object
      required: [activo]
      additionalProperties: false
      properties:
        activo: { $ref: "#/components/schemas/Activo" }
    ActivoResumen:
      type: object
      required: [id, codigo, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
    CodigoExistente:
      type: object
      required: [error, activo]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            request_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/ActivoResumen" }
    VersionDesactualizada:
      type: object
      required: [error, activo]
      additionalProperties: false
      description: El activo cambió desde que se leyó; trae el vigente (con precio, solo admin).
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            request_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/Activo" }
    EditarActivoBody:
      type: object
      additionalProperties: false
      description: >-
        Solo los campos que cambian; null o "" borra un opcional. El código no se puede
        cambiar (400 codigo_inmutable).
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        categoria_id: { type: string, format: uuid }
        precio_compra: { $ref: "#/components/schemas/Precio" }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        marca: { $ref: "#/components/schemas/TextoOpcional" }
        modelo: { $ref: "#/components/schemas/TextoOpcional" }
        subtipo: { $ref: "#/components/schemas/TextoOpcional" }
        fecha_compra: { type: [string, "null"], format: date, description: No futura. }
    Autor:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    SesionConteo:
      type: object
      required: [id, nombre, tipo, estado, fecha_corte, abierta_por, abierta_en, cerrada_por, cerrada_en]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string, enum: [conteo, importacion] }
        estado: { type: string, enum: [abierta, cerrada] }
        fecha_corte: { type: string, format: date }
        abierta_por: { $ref: "#/components/schemas/Autor" }
        abierta_en: { type: string, format: date-time }
        cerrada_por:
          oneOf:
            - { $ref: "#/components/schemas/Autor" }
            - { type: "null" }
        cerrada_en: { type: [string, "null"], format: date-time }
    SesionConteoRespuesta:
      type: object
      required: [sesion]
      additionalProperties: false
      properties:
        sesion: { $ref: "#/components/schemas/SesionConteo" }
    SesionAbierta:
      type: object
      required: [sesion]
      additionalProperties: false
      properties:
        sesion:
          oneOf:
            - { $ref: "#/components/schemas/SesionConteo" }
            - { type: "null" }
    ListaSesiones:
      type: object
      required: [sesiones]
      additionalProperties: false
      properties:
        sesiones:
          type: array
          items: { $ref: "#/components/schemas/SesionConteo" }
    AbrirSesionBody:
      type: object
      required: [nombre, fecha_corte]
      additionalProperties: false
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        fecha_corte: { type: string, format: date, description: Fecha a la que se refiere el informe. }
    AvanceUbicacion:
      type: object
      required: [ubicacion, total, verificados, pendientes]
      additionalProperties: false
      properties:
        ubicacion:
          type: object
          required: [id, ruta]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            ruta: { type: string }
        total: { type: integer, minimum: 0 }
        verificados: { type: integer, minimum: 0 }
        pendientes: { type: integer, minimum: 0 }
    Avance:
      type: object
      required: [total, verificados, pendientes, por_ubicacion]
      additionalProperties: false
      description: >-
        Activos activo o en_reparacion por su ubicación vigente y cuántos tienen
        verificación en la sesión. Información de trabajo; no es el informe.
      properties:
        total: { type: integer, minimum: 0 }
        verificados: { type: integer, minimum: 0 }
        pendientes: { type: integer, minimum: 0 }
        por_ubicacion:
          type: array
          items: { $ref: "#/components/schemas/AvanceUbicacion" }
    DetalleSesion:
      type: object
      required: [sesion, avance]
      additionalProperties: false
      properties:
        sesion: { $ref: "#/components/schemas/SesionConteo" }
        avance: { $ref: "#/components/schemas/Avance" }
    UbicacionRuta:
      type: object
      required: [id, ruta]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        ruta: { type: string }
    Verificacion:
      type: object
      required:
        [id, sesion_id, activo, ubicacion_esperada, ubicacion_encontrada, estado_fisico, nota, verificado_por, ocurrido_en, recibido_en, seq, foto_id]
      additionalProperties: false
      description: precio_al_contar solo existe en las respuestas al admin (P13).
      properties:
        id: { type: string, format: uuid }
        sesion_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/ActivoResumen" }
        ubicacion_esperada: { $ref: "#/components/schemas/UbicacionRuta" }
        ubicacion_encontrada: { $ref: "#/components/schemas/UbicacionRuta" }
        estado_fisico: { $ref: "#/components/schemas/EstadoFisico" }
        nota: { $ref: "#/components/schemas/NotaMotivo" }
        verificado_por: { $ref: "#/components/schemas/Autor" }
        ocurrido_en: { type: [string, "null"], format: date-time }
        recibido_en: { type: string, format: date-time }
        seq: { type: integer, minimum: 1 }
        foto_id:
          type: [string, "null"]
          format: uuid
          description: Foto opcional de esta verificación (spec 012).
        precio_al_contar: { $ref: "#/components/schemas/Precio" }
    EstadoFisico:
      type: string
      enum: [ok, danado]
    VerificacionRespuesta:
      type: object
      required: [verificacion]
      additionalProperties: false
      properties:
        verificacion: { $ref: "#/components/schemas/Verificacion" }
    UltimaVerificacion:
      type: object
      required: [verificacion]
      additionalProperties: false
      properties:
        verificacion:
          oneOf:
            - { $ref: "#/components/schemas/Verificacion" }
            - { type: "null" }
    VerificarBody:
      type: object
      required: [id, activo_id, ubicacion_encontrada_id, estado_fisico]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Lo genera el cliente; reintentar con el mismo id no duplica. }
        activo_id: { type: string, format: uuid }
        ubicacion_encontrada_id: { type: string, format: uuid, description: Sala o box activos donde se vio. }
        estado_fisico: { $ref: "#/components/schemas/EstadoFisico" }
        nota: { $ref: "#/components/schemas/NotaMotivo" }
        ocurrido_en: { type: [string, "null"], format: date-time, description: "Reloj del cliente, informativo." }
    ActivoConEstado:
      type: object
      required: [id, codigo, nombre, estado]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        estado: { $ref: "#/components/schemas/EstadoActivo" }
    Discrepancia:
      type: object
      required:
        [verificacion_id, activo, ubicacion_esperada, ubicacion_encontrada, ubicacion_actual, verificado_por, recibido_en, estado, resolucion]
      additionalProperties: false
      properties:
        verificacion_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/ActivoConEstado" }
        ubicacion_esperada: { $ref: "#/components/schemas/UbicacionRuta" }
        ubicacion_encontrada: { $ref: "#/components/schemas/UbicacionRuta" }
        ubicacion_actual: { $ref: "#/components/schemas/UbicacionRuta" }
        verificado_por: { $ref: "#/components/schemas/Autor" }
        recibido_en: { type: string, format: date-time }
        estado: { type: string, enum: [pendiente, desfasada, aplicada, descartada] }
        resolucion:
          oneOf:
            - type: object
              required: [tipo, por, en]
              additionalProperties: false
              properties:
                tipo: { type: string, enum: [aplicada, descartada] }
                por: { $ref: "#/components/schemas/Autor" }
                en: { type: string, format: date-time }
            - { type: "null" }
    ListaDiscrepancias:
      type: object
      required: [discrepancias]
      additionalProperties: false
      properties:
        discrepancias:
          type: array
          items: { $ref: "#/components/schemas/Discrepancia" }
    AplicarDiscrepanciasBody:
      type: object
      required: [verificaciones]
      additionalProperties: false
      properties:
        verificaciones:
          type: array
          description: De 1 a 100 ids de verificación, sin repetir.
          items: { type: string, format: uuid }
        confirmar_desfase:
          type: boolean
          description: Aplicar aunque el activo ya no esté en la ubicación esperada.
    DescartarDiscrepanciasBody:
      type: object
      required: [verificaciones]
      additionalProperties: false
      properties:
        verificaciones:
          type: array
          description: De 1 a 100 ids de verificación, sin repetir.
          items: { type: string, format: uuid }
    ResultadosDiscrepancias:
      type: object
      required: [resultados]
      additionalProperties: false
      properties:
        resultados:
          type: array
          items:
            type: object
            required: [verificacion_id, resultado]
            additionalProperties: false
            properties:
              verificacion_id: { type: string, format: uuid }
              resultado:
                type: string
                enum:
                  - aplicada
                  - descartada
                  - desfasada
                  - ya_en_la_encontrada
                  - ya_resuelta
                  - ya_no_es_discrepancia
                  - dado_de_baja
                  - ubicacion_invalida
                  - no_encontrada
              activo:
                type: object
                required: [id, codigo, nombre, ubicacion]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
                  codigo: { type: string }
                  nombre: { type: string }
                  ubicacion: { $ref: "#/components/schemas/UbicacionRuta" }
    Pendiente:
      type: object
      required: [id, codigo, nombre, categoria, ubicacion, estado]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        ubicacion: { $ref: "#/components/schemas/UbicacionRuta" }
        estado: { $ref: "#/components/schemas/EstadoActivo" }
    ListaPendientes:
      type: object
      required: [activos, total, pagina, por_pagina]
      additionalProperties: false
      properties:
        activos:
          type: array
          items: { $ref: "#/components/schemas/Pendiente" }
        total: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 1 }
        por_pagina: { type: integer, minimum: 1 }
    Cifras:
      type: object
      required: [encontrado, no_encontrado, registrado, unidades_encontrado, unidades_no_encontrado, unidades_registrado]
      additionalProperties: false
      properties:
        encontrado: { $ref: "#/components/schemas/Precio" }
        no_encontrado: { $ref: "#/components/schemas/Precio" }
        registrado: { $ref: "#/components/schemas/Precio" }
        unidades_encontrado: { type: integer, minimum: 0 }
        unidades_no_encontrado: { type: integer, minimum: 0 }
        unidades_registrado: { type: integer, minimum: 0 }
    FilaDesglose:
      type: object
      required: [id, etiqueta, total_encontrado, total_no_encontrado, total_registrado, unidades_encontrado, unidades_no_encontrado, unidades_registrado]
      additionalProperties: false
      description: etiqueta es el nombre de la categoría o la ruta de la ubicación al cierre.
      properties:
        id: { type: string, format: uuid }
        etiqueta: { type: string }
        total_encontrado: { $ref: "#/components/schemas/Precio" }
        total_no_encontrado: { $ref: "#/components/schemas/Precio" }
        total_registrado: { $ref: "#/components/schemas/Precio" }
        unidades_encontrado: { type: integer, minimum: 0 }
        unidades_no_encontrado: { type: integer, minimum: 0 }
        unidades_registrado: { type: integer, minimum: 0 }
    NoEncontrado:
      type: object
      required: [activo_id, codigo, nombre, categoria, ubicacion, precio, en_reparacion]
      additionalProperties: false
      properties:
        activo_id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        ubicacion: { $ref: "#/components/schemas/UbicacionRuta" }
        precio: { $ref: "#/components/schemas/Precio" }
        en_reparacion: { type: boolean }
    Informe:
      type: object
      required: [sesion, empresa, detalle_disponible, totales, desglose, no_encontrados]
      additionalProperties: false
      properties:
        sesion: { $ref: "#/components/schemas/SesionConteo" }
        empresa: { $ref: "#/components/schemas/EmpresaDelInforme" }
        detalle_disponible:
          type: boolean
          description: >-
            false en sesiones cerradas antes de la spec 013: no guardaron el detalle por
            activo ni la copia de la empresa.
        totales: { $ref: "#/components/schemas/Cifras" }
        desglose:
          type: object
          required: [categorias, ubicaciones]
          additionalProperties: false
          properties:
            categorias:
              type: array
              items: { $ref: "#/components/schemas/FilaDesglose" }
            ubicaciones:
              type: array
              items: { $ref: "#/components/schemas/FilaDesglose" }
        no_encontrados:
          type: array
          items: { $ref: "#/components/schemas/NoEncontrado" }
    FilaValor:
      type: object
      required: [id, etiqueta, valor, unidades]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        etiqueta: { type: string }
        valor: { $ref: "#/components/schemas/Precio" }
        unidades: { type: integer, minimum: 0 }
    ValorActual:
      type: object
      required: [total, unidades, en_reparacion, por_categoria, por_ubicacion, calculado_en]
      additionalProperties: false
      properties:
        total: { $ref: "#/components/schemas/Precio" }
        unidades: { type: integer, minimum: 0 }
        en_reparacion:
          type: object
          required: [valor, unidades]
          additionalProperties: false
          properties:
            valor: { $ref: "#/components/schemas/Precio" }
            unidades: { type: integer, minimum: 0 }
        por_categoria:
          type: array
          items: { $ref: "#/components/schemas/FilaValor" }
        por_ubicacion:
          type: array
          items: { $ref: "#/components/schemas/FilaValor" }
        calculado_en: { type: string, format: date-time }
    RefSesion:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    Porcentaje:
      type: string
      description: Porcentaje con un decimal y punto ("33.3"), calculado por el servidor.
    Inicio:
      type: object
      required: [activos_hoy, sesion_abierta]
      additionalProperties: false
      properties:
        activos_hoy:
          type: object
          required: [unidades, en_reparacion]
          additionalProperties: false
          properties:
            unidades: { type: integer, minimum: 0 }
            en_reparacion: { type: integer, minimum: 0 }
        sesion_abierta:
          oneOf:
            - type: object
              required: [id, nombre, fecha_corte, avance]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
                nombre: { type: string }
                fecha_corte: { type: string, format: date }
                avance:
                  type: object
                  required: [total, verificados, pendientes, porcentaje]
                  additionalProperties: false
                  properties:
                    total: { type: integer, minimum: 0 }
                    verificados: { type: integer, minimum: 0 }
                    pendientes: { type: integer, minimum: 0 }
                    porcentaje: { $ref: "#/components/schemas/Porcentaje" }
            - { type: "null" }
        valor_actual:
          type: object
          description: Solo admin. Valor vivo (R7); no es el informe.
          required: [total, unidades, calculado_en]
          additionalProperties: false
          properties:
            total: { $ref: "#/components/schemas/Precio" }
            unidades: { type: integer, minimum: 0 }
            calculado_en: { type: string, format: date-time }
        discrepancias:
          description: Solo admin. Por resolver en la sesión de referencia (abierta o última cerrada).
          oneOf:
            - type: object
              required: [por_resolver, sesion]
              additionalProperties: false
              properties:
                por_resolver: { type: integer, minimum: 0 }
                sesion: { $ref: "#/components/schemas/RefSesion" }
            - { type: "null" }
        danados:
          type: object
          description: Solo admin. En reparación ∪ dañados en la sesión de referencia (P26).
          required: [total, en_reparacion, danados, sesion]
          additionalProperties: false
          properties:
            total: { type: integer, minimum: 0 }
            en_reparacion: { type: integer, minimum: 0 }
            danados: { type: integer, minimum: 0 }
            sesion:
              oneOf:
                - { $ref: "#/components/schemas/RefSesion" }
                - { type: "null" }
        ultimo_informe:
          description: Solo admin. Tres cifras congeladas del último cierre de tipo conteo.
          oneOf:
            - type: object
              required: [sesion, totales]
              additionalProperties: false
              properties:
                sesion: { $ref: "#/components/schemas/SesionConteo" }
                totales: { $ref: "#/components/schemas/Cifras" }
            - { type: "null" }
    EventoActividad:
      type: object
      required: [seq, tipo, ocurrido_en, autor, datos, activo]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        tipo: { $ref: "#/components/schemas/TipoEvento" }
        ocurrido_en: { type: string, format: date-time }
        autor:
          type: object
          required: [id, nombre]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        datos:
          type: object
          description: Contenido por tipo (docs/03, spec 005); sin precios para el contador.
        activo:
          type: object
          required: [id, codigo, nombre]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            codigo: { type: string }
            nombre: { type: string }
    Actividad:
      type: object
      required: [eventos, siguiente]
      additionalProperties: false
      properties:
        eventos:
          type: array
          items: { $ref: "#/components/schemas/EventoActividad" }
        siguiente:
          type: [integer, "null"]
          description: Cursor para la página siguiente (antes_de); null si no hay más.
    Evolucion:
      type: object
      required: [sesiones, por_categoria]
      additionalProperties: false
      properties:
        sesiones:
          type: array
          items:
            type: object
            required: [sesion, total_registrado, unidades_registrado, unidades_encontrado, porcentaje_encontrado]
            additionalProperties: false
            properties:
              sesion:
                type: object
                required: [id, nombre, fecha_corte, cerrada_en]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  fecha_corte: { type: string, format: date }
                  cerrada_en: { type: [string, "null"], format: date-time }
              total_registrado: { $ref: "#/components/schemas/Precio" }
              unidades_registrado: { type: integer, minimum: 0 }
              unidades_encontrado: { type: integer, minimum: 0 }
              porcentaje_encontrado: { $ref: "#/components/schemas/Porcentaje" }
        por_categoria:
          type: array
          items:
            type: object
            required: [categoria_id, etiqueta, puntos]
            additionalProperties: false
            properties:
              categoria_id: { type: string, format: uuid }
              etiqueta: { type: string, description: Nombre al cierre más reciente en que aparece. }
              puntos:
                type: array
                items:
                  type: object
                  required: [sesion_id, total_registrado, unidades_registrado]
                  additionalProperties: false
                  properties:
                    sesion_id: { type: string, format: uuid }
                    total_registrado: { $ref: "#/components/schemas/Precio" }
                    unidades_registrado: { type: integer, minimum: 0 }
    TipoEvento:
      type: string
      enum:
        - creado
        - importado
        - verificado
        - ubicacion_cambiada
        - precio_cambiado
        - estado_cambiado
        - categoria_cambiada
        - datos_cambiados
        - dado_de_baja
        - discrepancia_descartada
        - foto_agregada
        - foto_cambiada
        - foto_retirada
    EventoActivo:
      type: object
      required: [seq, tipo, ocurrido_en, autor, datos]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        tipo: { $ref: "#/components/schemas/TipoEvento" }
        ocurrido_en: { type: string, format: date-time }
        autor:
          type: object
          required: [id, nombre]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        datos:
          type: object
          description: Contenido por tipo (docs/03, spec 005); sin precios para el contador.
        foto_id:
          type: string
          format: uuid
          description: Foto de la verificación del evento, si la tiene (spec 012).
    Historial:
      type: object
      required: [eventos, siguiente]
      additionalProperties: false
      properties:
        eventos:
          type: array
          items: { $ref: "#/components/schemas/EventoActivo" }
        siguiente:
          type: [integer, "null"]
          description: Cursor para la página siguiente (antes_de); null si no hay más.
    MoverActivoBody:
      type: object
      required: [ubicacion_id]
      additionalProperties: false
      properties:
        ubicacion_id: { type: string, format: uuid, description: Una sala o un box activos (D1). }
    NotaMotivo:
      type: [string, "null"]
      maxLength: 120
      description: Texto corto (H-3); en una baja o reactivación, obligatoria si el motivo es "otro".
    EstadoActivoBody:
      type: object
      required: [estado]
      additionalProperties: false
      description: >-
        Entre activo y en_reparacion sin motivo. Un dado de baja solo pasa a activo y con
        motivo (reactivar).
      properties:
        estado: { type: string, enum: [activo, en_reparacion] }
        motivo: { type: string, enum: [encontrado, baja_por_error, otro] }
        nota: { $ref: "#/components/schemas/NotaMotivo" }
    BajaActivoBody:
      type: object
      required: [motivo]
      additionalProperties: false
      properties:
        motivo:
          type: string
          enum: [danado_sin_reparacion, perdido, vendido_o_donado, obsoleto, otro]
        nota: { $ref: "#/components/schemas/NotaMotivo" }
    CrearActivoBody:
      type: object
      required: [id, codigo, nombre, precio_compra, categoria_id, ubicacion_id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Lo genera el cliente; reintentar con el mismo id no duplica. }
        codigo: { type: string, description: "1 a 40: letras sin tilde, números y - . / _; se guarda en mayúsculas." }
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        precio_compra: { $ref: "#/components/schemas/Precio" }
        categoria_id: { type: string, format: uuid }
        ubicacion_id: { type: string, format: uuid, description: Una sala o un box activos (D1). }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        marca: { $ref: "#/components/schemas/TextoOpcional" }
        modelo: { $ref: "#/components/schemas/TextoOpcional" }
        subtipo: { $ref: "#/components/schemas/TextoOpcional" }
        fecha_compra: { type: [string, "null"], format: date, description: No futura. }
    DuplicarActivoBody:
      type: object
      required: [id, codigo, copiar_de]
      additionalProperties: false
      description: >-
        El servidor copia nombre, categoría, marca, modelo, subtipo, precio y ubicación
        del original; nunca código, serial ni historial.
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
