      description: >-
        En una transacción crea el tenant activo, su ficha (sin logo), el usuario admin con
        debe_cambiar_password y su membresía admin; sin invitación. La contraseña se valida
        con la política vigente y su confirmación en el servidor, se guarda solo con
        Argon2id y nunca se devuelve. Si un dato no es válido, el error lo nombra en campo.
      security:
