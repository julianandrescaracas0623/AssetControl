      additionalProperties: false
      properties:
        nombre: { type: string }
        email: { type: string }
        password: { type: string, format: password }
        password_confirmacion: { type: string, format: password }
    CrearEmpresaBody:
      type: object
      required: [id, nombre, direccion, admin]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: UUID del cliente (idempotencia). }
        nombre: { type: string, description: Nombre o razón social; también el del tenant. }
        direccion: { type: string }
        nit: { type: [string, "null"] }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"] }
        admin: { $ref: "#/components/schemas/AdminInicialBody" }
    EmpresaCreada:
      type: object
      required: [empresa_id, admin_id]
      additionalProperties: false
      properties:
        empresa_id: { type: string, format: uuid }
