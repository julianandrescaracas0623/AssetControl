        activa: { type: boolean }
        creado_en: { type: string, format: date-time }
        tiene_logo: { type: boolean }
        n_membresias_activas: { type: integer, minimum: 0 }
        n_admins_activos: { type: integer, minimum: 0 }
    ListaEmpresasPlataforma:
      type: object
      required: [empresas]
      additionalProperties: false
      properties:
        empresas:
          type: array
          items: { $ref: "#/components/schemas/EmpresaPlataforma" }
    AdminInicialBody:
