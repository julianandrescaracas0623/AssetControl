# Contrato de la API de AssetControl (spec 002b, T1; R17).
#
# Escrito a mano. tests/test_openapi.py lo ata al backend: rutas de Flask iguales a
# `paths`, respuestas reales validadas contra estos esquemas y la lista de códigos
# de error igual a la del backend. La web genera sus tipos de este archivo
# (`cd web && npm run api:types`). Si cambias un endpoint, cambia aquí y regenera.
#
# En desarrollo la web llama a estas rutas con el prefijo /api (proxy de Vite).
openapi: 3.1.0
info:
  title: AssetControl API
  version: 0.1.0
  description: >-
    API de AssetControl. Toda respuesta lleva la cabecera X-Request-ID; los errores
    tienen la forma {error: {code, message, request_id}}. /auth y /invitaciones
    responden Cache-Control no-store y Referrer-Policy no-referrer y aceptan
    cuerpos de hasta 4 KB.

tags:
  - name: meta
  - name: auth
  - name: invitaciones
  - name: catalogo
  - name: activos

paths:
  /health:
    get:
      tags: [meta]
      operationId: health
      summary: Estado de la API y de la base
      responses:
        "200":
          description: La base responde.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: La base no responde.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /ready:
    get:
      tags: [meta]
      operationId: ready
      summary: Lista para recibir tráfico (resultado guardado unos segundos)
      responses:
        "200":
          description: Lista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: No lista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginBody" }
      responses:
        "200":
          $ref: "#/components/responses/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          description: Credenciales incorrectas (mismo mensaje para cualquier causa).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [credenciales_invalidas]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Renovar la sesión con la cookie de refresh (la rota)
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          $ref: "#/components/responses/SesionIniciada"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar sesión (revoca el refresh y borra la cookie)
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Sesión cerrada, haya o no una cookie válida.
          headers:
            Set-Cookie:
              description: Borra la cookie de refresh.
              required: true
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Usuario, tenant y rol de la sesión (leídos de la base en cada petición)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario actual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioActual" }
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /invitaciones:
    post:
      tags: [invitaciones]
      operationId: crearInvitacion
      summary: Invitar a una persona (solo admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitarBody" }
      responses:
        "201":
          description: >-
            Invitación creada. El enlace sale solo en esta respuesta y vence en 72 horas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitacionCreada" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /invitaciones/validar:
    post:
      tags: [invitaciones]
      operationId: validarInvitacion
      summary: Saber si un token de invitación está vigente (no lo consume)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidarBody" }
      responses:
        "200":
          description: Vencida, usada, inexistente o mal formada dan el mismo false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vigencia" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /invitaciones/aceptar:
    post:
      tags: [invitaciones]
      operationId: aceptarInvitacion
      summary: Aceptar la invitación con nombre y contraseña (sin email)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AceptarBody" }
      responses:
        "201":
          $ref: "#/components/responses/SesionIniciada"
        "400":
          description: >-
            Cuerpo o nombre no válidos (solicitud_invalida), contraseña fuera de la
            política (contrasena_*) o invitación no vigente (invitacion_invalida,
            mismo mensaje para cualquier causa).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos:
            - solicitud_invalida
            - contrasena_invalida
            - contrasena_corta
            - contrasena_larga
            - contrasena_comun
            - invitacion_invalida
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "500":
          description: >-
            La cuenta se creó pero no se pudo emitir la sesión: la persona entra con
            el login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [error_interno]
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /ubicaciones:
    get:
      tags: [catalogo]
      operationId: listarUbicaciones
      summary: Ubicaciones del tenant (el contador recibe solo las activas)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ordenadas por tipo (sede, sala, box) y nombre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaUbicaciones" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [catalogo]
      operationId: crearUbicacion
      summary: Crear una sede, sala o box (solo admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearUbicacionBody" }
      responses:
        "201":
          description: Creada y activa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UbicacionRespuesta" }
        "400":
          description: Cuerpo o nombre no válidos, o tipo y padre que no encajan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, jerarquia_invalida]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Nombre repetido entre hermanas o padre inactivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [nombre_duplicado, padre_inactivo]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /ubicaciones/{id}:
    patch:
      tags: [catalogo]
      operationId: actualizarUbicacion
      summary: Renombrar, desactivar o reactivar (solo admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActualizarUbicacionBody" }
      responses:
        "200":
          description: Actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UbicacionRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: >-
            Nombre repetido, hijas activas o activos al desactivar (D2 de la spec 004) o
            padre inactivo al reactivar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [nombre_duplicado, tiene_hijas_activas, padre_inactivo, tiene_activos]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /categorias:
    get:
      tags: [catalogo]
      operationId: listarCategorias
      summary: Categorías del tenant, por nombre
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista cerrada de la clínica.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaCategorias" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [catalogo]
      operationId: crearCategoria
      summary: Crear una categoría (solo admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NombreBody" }
      responses:
        "201":
          description: Creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriaRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/NombreDuplicado"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /categorias/{id}:
    patch:
      tags: [catalogo]
      operationId: renombrarCategoria
      summary: Renombrar una categoría (solo admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NombreBody" }
      responses:
        "200":
          description: Renombrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriaRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/NombreDuplicado"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /categorias/sugeridas:
    post:
      tags: [catalogo]
      operationId: cargarCategoriasSugeridas
      summary: Crear las 6 categorías sugeridas que falten (idempotente; solo admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista completa y cuántas se crearon ahora.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SugeridasCargadas" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"

  /activos:
    get:
      tags: [activos]
      operationId: buscarActivos
      summary: Buscar por código, nombre o serial; 25 por página, lo más reciente primero
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: estado, in: query, required: false, schema: { $ref: "#/components/schemas/EstadoActivo" } }
        - name: ubicacion_id
          in: query
          required: false
          description: Solo los activos de esa ubicación exacta (spec 005, R10).
          schema: { type: string, format: uuid }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Página de resultados (precio solo para el admin).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaActivos" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [activos]
      operationId: crearActivo
      summary: Dar de alta o duplicar un activo (admin y contador; idempotente por id)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CrearActivoBody"
                - $ref: "#/components/schemas/DuplicarActivoBody"
      responses:
        "200":
          description: Reintento con el mismo id y código; devuelve el ya guardado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "201":
          description: Creado con su evento "creado".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "400":
          description: Cuerpo, código, precio o ubicación no válidos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, codigo_invalido, precio_invalido, ubicacion_invalida]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: El código ya es de otro activo; se devuelve ese activo para abrirlo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodigoExistente" }
          x-codigos: [codigo_existente]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /activos/sugerencias:
    get:
      tags: [activos]
      operationId: sugerenciasActivos
      summary: Valores ya registrados de un campo, los más usados primero (hasta 8)
      security:
        - bearerAuth: []
      parameters:
        - name: campo
          in: query
          required: true
          schema: { type: string, enum: [nombre, marca, modelo, subtipo] }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
      responses:
        "200":
          description: Valores distintos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sugerencias" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /activos/por-codigo:
    get:
      tags: [activos]
      operationId: resolverCodigo
      summary: El activo de un código de sticker (se normaliza a mayúsculas)
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Existe en este tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "400":
          description: El texto no tiene el formato de un código.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [codigo_invalido]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /activos/{id}:
    get:
      tags: [activos]
      operationId: fichaActivo
      summary: Ficha de solo lectura de un activo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: El activo (con precio solo para el admin).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      tags: [activos]
      operationId: editarActivo
      summary: Editar un activo (solo admin; cada cambio deja su evento)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditarActivoBody" }
      responses:
        "200":
          $ref: "#/components/responses/ActivoCambiado"
        "400":
          description: Cuerpo o precio no válidos, o se intentó cambiar el código.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, precio_invalido, codigo_inmutable]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ActivoDadoDeBaja"
        "412":
          $ref: "#/components/responses/VersionDesactualizada"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "428":
          $ref: "#/components/responses/FaltaVersion"

  /activos/{id}/historial:
    get:
      tags: [activos]
      operationId: historialActivo
      summary: Línea de tiempo del activo, lo más reciente primero (50 por página)
      description: >-
        Al contador se le omiten los eventos precio_cambiado y toda clave de precio de los
        demás (P13).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: antes_de
          in: query
          required: false
          description: El valor de "siguiente" de la página anterior.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Una página de eventos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Historial" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /activos/{id}/mover:
    post:
      tags: [activos]
      operationId: moverActivo
      summary: Mover a otra sala o box activos (solo admin; evento ubicacion_cambiada)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoverActivoBody" }
      responses:
        "200":
          $ref: "#/components/responses/ActivoCambiado"
        "400":
          description: Cuerpo no válido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, ubicacion_invalida]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ActivoDadoDeBaja"
        "412":
          $ref: "#/components/responses/VersionDesactualizada"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "428":
          $ref: "#/components/responses/FaltaVersion"

  /activos/{id}/estado:
    post:
      tags: [activos]
      operationId: cambiarEstadoActivo
      summary: Activo ↔ en reparación, o reactivar un dado de baja con motivo (solo admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstadoActivoBody" }
      responses:
        "200":
          $ref: "#/components/responses/ActivoCambiado"
        "400":
          description: Cuerpo no válido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, motivo_invalido]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ActivoDadoDeBaja"
        "412":
          $ref: "#/components/responses/VersionDesactualizada"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "428":
          $ref: "#/components/responses/FaltaVersion"

  /activos/{id}/baja:
    post:
      tags: [activos]
      operationId: darDeBajaActivo
      summary: Dar de baja con motivo (solo admin; evento dado_de_baja)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BajaActivoBody" }
      responses:
        "200":
          $ref: "#/components/responses/ActivoCambiado"
        "400":
          description: Cuerpo no válido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, motivo_invalido]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ActivoDadoDeBaja"
        "412":
          $ref: "#/components/responses/VersionDesactualizada"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "428":
          $ref: "#/components/responses/FaltaVersion"

  /sesiones:
    get:
      tags: [conteo]
      operationId: listarSesiones
      summary: Sesiones de conteo; la abierta primero y luego las más recientes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Todas las sesiones del tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaSesiones" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [conteo]
      operationId: abrirSesion
      summary: Abrir una sesión de conteo (solo admin; una abierta por clínica)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AbrirSesionBody" }
      responses:
        "201":
          description: Abierta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SesionConteoRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          description: Ya hay una sesión de conteo abierta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [sesion_abierta_existente]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /sesiones/abierta:
    get:
      tags: [conteo]
      operationId: sesionAbierta
      summary: La sesión de conteo abierta, o null si no hay
      security:
        - bearerAuth: []
      responses:
        "200":
          description: La abierta o null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SesionAbierta" }
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /sesiones/{id}:
    get:
      tags: [conteo]
      operationId: detalleSesion
      summary: Sesión y avance por ubicación (sin precios; no es el informe)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: La sesión y su avance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetalleSesion" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /sesiones/{id}/verificaciones:
    get:
      tags: [conteo]
      operationId: ultimaVerificacion
      summary: La verificación vigente (mayor seq) de un activo en la sesión, o null
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: activo_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: La última verificación o null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UltimaVerificacion" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    post:
      tags: [conteo]
      operationId: verificarActivo
      summary: Verificar un activo (ambos roles; idempotente por id)
      description: >-
        Copia del activo el precio, la categoría y la ubicación de ese momento. Un
        reintento con el mismo id devuelve la guardada (200), aunque la sesión se haya
        cerrado después.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificarBody" }
      responses:
        "200":
          description: Reintento; la verificación ya guardada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificacionRespuesta" }
        "201":
          description: Guardada con su evento "verificado".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificacionRespuesta" }
        "400":
          description: Cuerpo no válido o la ubicación encontrada no es una sala o box activos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, ubicacion_invalida]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: La sesión no está abierta o el activo está dado de baja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [sesion_cerrada, activo_dado_de_baja]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso (15 minutos). Guárdalo solo en memoria.

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'row_version del activo leído, "3" o 3; si no coincide, 412.'
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      description: Un id de otro tenant responde 404, igual que uno inexistente.
      schema: { type: string, format: uuid }
    Csrf:
      name: X-AssetControl-CSRF
      in: header
      required: true
      description: Debe valer 1; además la petición debe venir del mismo sitio.
      schema: { type: string, const: "1" }
    RefreshCookie:
      name: refresh
      in: cookie
      required: false
      description: >-
        Cookie HttpOnly de refresh (__Secure-refresh fuera de desarrollo), Path=/auth.
      schema: { type: string }

  responses:
    SesionIniciada:
      description: Sesión emitida; deja la cookie de refresh (HttpOnly, SameSite=Lax).
      headers:
        Set-Cookie:
          description: Cookie de refresh nueva.
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Sesion" }
    SolicitudInvalida:
      description: El cuerpo no es JSON válido o le faltan campos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [solicitud_invalida]
    NoAutenticado:
      description: Sin sesión válida.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [no_autenticado]
    NoEncontrado:
      description: No existe en este tenant (o es de otro).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [no_encontrado]
    NombreDuplicado:
      description: Ya existe una con ese nombre (sin distinguir mayúsculas ni tildes).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [nombre_duplicado]
    Prohibido:
      description: Rol insuficiente o petición de otro sitio (sin cabecera CSRF).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [prohibido]
    ActivoDadoDeBaja:
      description: El activo está dado de baja; solo se puede reactivar.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [activo_dado_de_baja]
    FaltaVersion:
      description: Falta If-Match o no tiene la forma "N".
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [falta_version]
    VersionDesactualizada:
      description: La versión no coincide; no se guardó nada. Trae el activo vigente.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/VersionDesactualizada" }
      x-codigos: [version_desactualizada]
    ActivoCambiado:
      description: Guardado (o sin cambios); el activo con precio y su versión.
      headers:
        ETag:
          description: La versión nueva entre comillas, para el próximo If-Match.
          required: true
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ActivoRespuesta" }
    CuerpoDemasiadoGrande:
      description: El cuerpo supera 4 KB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [cuerpo_demasiado_grande]
    DemasiadasSolicitudes:
      description: Límite de tasa superado (igual exista o no la cuenta).
      headers:
        Retry-After:
          description: Segundos de la ventana del límite.
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [demasiadas_solicitudes]
    ServicioNoDisponible:
      description: No se pudo contar el intento o el servidor está saturado.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar.
          required: true
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
      x-codigos: [servicio_no_disponible]

  schemas:
    ErrorCode:
      type: string
      description: Código estable del error; el texto para la persona va en message.
      enum:
        - solicitud_invalida
        - no_autenticado
        - prohibido
        - no_encontrado
        - metodo_no_permitido
        - cuerpo_demasiado_grande
        - tipo_no_soportado
        - error_http
        - error_interno
        - servicio_no_disponible
        - demasiadas_solicitudes
        - credenciales_invalidas
        - invitacion_invalida
        - contrasena_invalida
        - contrasena_corta
        - contrasena_larga
        - contrasena_comun
        - jerarquia_invalida
        - nombre_duplicado
        - tiene_hijas_activas
        - padre_inactivo
        - tiene_activos
        - codigo_invalido
        - precio_invalido
        - ubicacion_invalida
        - codigo_existente
        - falta_version
        - version_desactualizada
        - codigo_inmutable
        - activo_dado_de_baja
        - motivo_invalido
        - sesion_abierta_existente
        - sesion_cerrada
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: Texto en español para mostrar. }
            request_id: { type: string, format: uuid }

    Rol:
      type: string
      enum: [admin, contador]
    Usuario:
      type: object
      required: [id, email, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombre: { type: string }
    Tenant:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    UsuarioActual:
      type: object
      required: [usuario, tenant, rol]
      additionalProperties: false
      properties:
        usuario: { $ref: "#/components/schemas/Usuario" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        rol: { $ref: "#/components/schemas/Rol" }
    Sesion:
      type: object
      required: [access_token, token_type, expires_in, usuario, tenant, rol]
      additionalProperties: false
      properties:
        access_token: { type: string, description: JWT de acceso; solo en memoria. }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1, description: Segundos de vida del token. }
        usuario: { $ref: "#/components/schemas/Usuario" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        rol: { $ref: "#/components/schemas/Rol" }

    LoginBody:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string, format: password }
    InvitarBody:
      type: object
      required: [email, rol]
      additionalProperties: false
      properties:
        email: { type: string }
        rol: { $ref: "#/components/schemas/Rol" }
    ValidarBody:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: Token del fragmento del enlace. }
    AceptarBody:
      type: object
      required: [token, nombre, password]
      additionalProperties: false
      properties:
        token: { type: string }
        nombre:
          type: string
          maxLength: 120
          description: >-
            Nombre visible: se guarda en NFC y sin espacios en los extremos; necesita una
            letra o un número y no admite caracteres invisibles o de control.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128

    Invitacion:
      type: object
      required: [id, email, rol, expira_en]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        rol: { $ref: "#/components/schemas/Rol" }
        expira_en: { type: string, format: date-time }
    InvitacionCreada:
      type: object
      required: [invitacion, enlace]
      additionalProperties: false
      properties:
        invitacion: { $ref: "#/components/schemas/Invitacion" }
        enlace:
          type: string
          description: Ruta relativa /invitacion#<token>; se muestra una sola vez.
    Vigencia:
      type: object
      required: [vigente]
      additionalProperties: false
      properties:
        vigente: { type: boolean }

    NombreVisible:
      type: string
      maxLength: 120
      description: >-
        Se guarda en NFC y sin espacios en los extremos; necesita una letra o un número
        y no admite caracteres invisibles o de control.
    TipoUbicacion:
      type: string
      enum: [sede, sala, box]
    Ubicacion:
      type: object
      required: [id, nombre, tipo, padre_id, activa]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { $ref: "#/components/schemas/TipoUbicacion" }
        padre_id:
          type: [string, "null"]
          format: uuid
          description: Null solo en una sede.
        activa: { type: boolean }
    UbicacionRespuesta:
      type: object
      required: [ubicacion]
      additionalProperties: false
      properties:
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }
    ListaUbicaciones:
      type: object
      required: [ubicaciones]
      additionalProperties: false
      properties:
        ubicaciones:
          type: array
          items: { $ref: "#/components/schemas/Ubicacion" }
    CrearUbicacionBody:
      type: object
      required: [nombre, tipo]
      additionalProperties: false
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        tipo: { $ref: "#/components/schemas/TipoUbicacion" }
        padre_id:
          type: string
          format: uuid
          description: Obligatorio para sala (una sede) y box (una sala); prohibido en sede.
    ActualizarUbicacionBody:
      type: object
      additionalProperties: false
      description: Al menos uno de los dos campos.
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        activa: { type: boolean }

    Categoria:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    CategoriaRespuesta:
      type: object
      required: [categoria]
      additionalProperties: false
      properties:
        categoria: { $ref: "#/components/schemas/Categoria" }
    ListaCategorias:
      type: object
      required: [categorias]
      additionalProperties: false
      properties:
        categorias:
          type: array
          items: { $ref: "#/components/schemas/Categoria" }
    SugeridasCargadas:
      type: object
      required: [categorias, creadas]
      additionalProperties: false
      properties:
        categorias:
          type: array
          items: { $ref: "#/components/schemas/Categoria" }
        creadas: { type: integer, minimum: 0 }
    NombreBody:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }

    Precio:
      type: string
      description: >-
        Decimal en texto canónico ("1390000.50"), mayor o igual a 0 y con hasta dos
        decimales. Nunca un número JSON.
    EstadoActivo:
      type: string
      enum: [activo, en_reparacion, dado_de_baja]
    TextoOpcional:
      type: [string, "null"]
      maxLength: 120
    Activo:
      type: object
      required:
        [id, codigo, nombre, categoria, ubicacion, serial, marca, modelo, subtipo, fecha_compra, estado, row_version, creado_en]
      additionalProperties: false
      description: precio_compra solo existe en las respuestas al admin (P13).
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        ubicacion: { $ref: "#/components/schemas/UbicacionDeActivo" }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        marca: { $ref: "#/components/schemas/TextoOpcional" }
        modelo: { $ref: "#/components/schemas/TextoOpcional" }
        subtipo: { $ref: "#/components/schemas/TextoOpcional" }
        fecha_compra: { type: [string, "null"], format: date }
        estado: { $ref: "#/components/schemas/EstadoActivo" }
        row_version:
          type: integer
          minimum: 1
          description: Versión para If-Match al cambiar el activo (spec 005).
        creado_en: { type: string, format: date-time }
        precio_compra: { $ref: "#/components/schemas/Precio" }
    UbicacionDeActivo:
      type: object
      required: [id, nombre, ruta]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        ruta: { type: string, description: '"Sala › Box" o el nombre de la sala.' }
    ListaActivos:
      type: object
      required: [activos, total, pagina, por_pagina]
      additionalProperties: false
      properties:
        activos:
          type: array
          items: { $ref: "#/components/schemas/Activo" }
        total: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 1 }
        por_pagina: { type: integer, minimum: 1 }
    Sugerencias:
      type: object
      required: [valores]
      additionalProperties: false
      properties:
        valores:
          type: array
          items: { type: string }
    ActivoRespuesta:
      type: object
      required: [activo]
      additionalProperties: false
      properties:
        activo: { $ref: "#/components/schemas/Activo" }
    ActivoResumen:
      type: object
      required: [id, codigo, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
    CodigoExistente:
      type: object
      required: [error, activo]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            request_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/ActivoResumen" }
    VersionDesactualizada:
      type: object
      required: [error, activo]
      additionalProperties: false
      description: El activo cambió desde que se leyó; trae el vigente (con precio, solo admin).
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            request_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/Activo" }
    EditarActivoBody:
      type: object
      additionalProperties: false
      description: >-
        Solo los campos que cambian; null o "" borra un opcional. El código no se puede
        cambiar (400 codigo_inmutable).
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        categoria_id: { type: string, format: uuid }
        precio_compra: { $ref: "#/components/schemas/Precio" }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        marca: { $ref: "#/components/schemas/TextoOpcional" }
        modelo: { $ref: "#/components/schemas/TextoOpcional" }
        subtipo: { $ref: "#/components/schemas/TextoOpcional" }
        fecha_compra: { type: [string, "null"], format: date, description: No futura. }
    Autor:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    SesionConteo:
      type: object
      required: [id, nombre, tipo, estado, fecha_corte, abierta_por, abierta_en, cerrada_por, cerrada_en]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string, enum: [conteo, importacion] }
        estado: { type: string, enum: [abierta, cerrada] }
        fecha_corte: { type: string, format: date }
        abierta_por: { $ref: "#/components/schemas/Autor" }
        abierta_en: { type: string, format: date-time }
        cerrada_por:
          oneOf:
            - { $ref: "#/components/schemas/Autor" }
            - { type: "null" }
        cerrada_en: { type: [string, "null"], format: date-time }
    SesionConteoRespuesta:
      type: object
      required: [sesion]
      additionalProperties: false
      properties:
        sesion: { $ref: "#/components/schemas/SesionConteo" }
    SesionAbierta:
      type: object
      required: [sesion]
      additionalProperties: false
      properties:
        sesion:
          oneOf:
            - { $ref: "#/components/schemas/SesionConteo" }
            - { type: "null" }
    ListaSesiones:
      type: object
      required: [sesiones]
      additionalProperties: false
      properties:
        sesiones:
          type: array
          items: { $ref: "#/components/schemas/SesionConteo" }
    AbrirSesionBody:
      type: object
      required: [nombre, fecha_corte]
      additionalProperties: false
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        fecha_corte: { type: string, format: date, description: Fecha a la que se refiere el informe. }
    AvanceUbicacion:
      type: object
      required: [ubicacion, total, verificados, pendientes]
      additionalProperties: false
      properties:
        ubicacion:
          type: object
          required: [id, ruta]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            ruta: { type: string }
        total: { type: integer, minimum: 0 }
        verificados: { type: integer, minimum: 0 }
        pendientes: { type: integer, minimum: 0 }
    Avance:
      type: object
      required: [total, verificados, pendientes, por_ubicacion]
      additionalProperties: false
      description: >-
        Activos activo o en_reparacion por su ubicación vigente y cuántos tienen
        verificación en la sesión. Información de trabajo; no es el informe.
      properties:
        total: { type: integer, minimum: 0 }
        verificados: { type: integer, minimum: 0 }
        pendientes: { type: integer, minimum: 0 }
        por_ubicacion:
          type: array
          items: { $ref: "#/components/schemas/AvanceUbicacion" }
    DetalleSesion:
      type: object
      required: [sesion, avance]
      additionalProperties: false
      properties:
        sesion: { $ref: "#/components/schemas/SesionConteo" }
        avance: { $ref: "#/components/schemas/Avance" }
    UbicacionRuta:
      type: object
      required: [id, ruta]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        ruta: { type: string }
    Verificacion:
      type: object
      required:
        [id, sesion_id, activo, ubicacion_esperada, ubicacion_encontrada, estado_fisico, nota, verificado_por, ocurrido_en, recibido_en, seq]
      additionalProperties: false
      description: precio_al_contar solo existe en las respuestas al admin (P13).
      properties:
        id: { type: string, format: uuid }
        sesion_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/ActivoResumen" }
        ubicacion_esperada: { $ref: "#/components/schemas/UbicacionRuta" }
        ubicacion_encontrada: { $ref: "#/components/schemas/UbicacionRuta" }
        estado_fisico: { $ref: "#/components/schemas/EstadoFisico" }
        nota: { $ref: "#/components/schemas/NotaMotivo" }
        verificado_por: { $ref: "#/components/schemas/Autor" }
        ocurrido_en: { type: [string, "null"], format: date-time }
        recibido_en: { type: string, format: date-time }
        seq: { type: integer, minimum: 1 }
        precio_al_contar: { $ref: "#/components/schemas/Precio" }
    EstadoFisico:
      type: string
      enum: [ok, danado]
    VerificacionRespuesta:
      type: object
      required: [verificacion]
      additionalProperties: false
      properties:
        verificacion: { $ref: "#/components/schemas/Verificacion" }
    UltimaVerificacion:
      type: object
      required: [verificacion]
      additionalProperties: false
      properties:
        verificacion:
          oneOf:
            - { $ref: "#/components/schemas/Verificacion" }
            - { type: "null" }
    VerificarBody:
      type: object
      required: [id, activo_id, ubicacion_encontrada_id, estado_fisico]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Lo genera el cliente; reintentar con el mismo id no duplica. }
        activo_id: { type: string, format: uuid }
        ubicacion_encontrada_id: { type: string, format: uuid, description: Sala o box activos donde se vio. }
        estado_fisico: { $ref: "#/components/schemas/EstadoFisico" }
        nota: { $ref: "#/components/schemas/NotaMotivo" }
        ocurrido_en: { type: [string, "null"], format: date-time, description: "Reloj del cliente, informativo." }
    TipoEvento:
      type: string
      enum:
        - creado
        - importado
        - verificado
        - ubicacion_cambiada
        - precio_cambiado
        - estado_cambiado
        - categoria_cambiada
        - datos_cambiados
        - dado_de_baja
    EventoActivo:
      type: object
      required: [seq, tipo, ocurrido_en, autor, datos]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        tipo: { $ref: "#/components/schemas/TipoEvento" }
        ocurrido_en: { type: string, format: date-time }
        autor:
          type: object
          required: [id, nombre]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        datos:
          type: object
          description: Contenido por tipo (docs/03, spec 005); sin precios para el contador.
    Historial:
      type: object
      required: [eventos, siguiente]
      additionalProperties: false
      properties:
        eventos:
          type: array
          items: { $ref: "#/components/schemas/EventoActivo" }
        siguiente:
          type: [integer, "null"]
          description: Cursor para la página siguiente (antes_de); null si no hay más.
    MoverActivoBody:
      type: object
      required: [ubicacion_id]
      additionalProperties: false
      properties:
        ubicacion_id: { type: string, format: uuid, description: Una sala o un box activos (D1). }
    NotaMotivo:
      type: [string, "null"]
      maxLength: 120
      description: Texto corto (H-3); en una baja o reactivación, obligatoria si el motivo es "otro".
    EstadoActivoBody:
      type: object
      required: [estado]
      additionalProperties: false
      description: >-
        Entre activo y en_reparacion sin motivo. Un dado de baja solo pasa a activo y con
        motivo (reactivar).
      properties:
        estado: { type: string, enum: [activo, en_reparacion] }
        motivo: { type: string, enum: [encontrado, baja_por_error, otro] }
        nota: { $ref: "#/components/schemas/NotaMotivo" }
    BajaActivoBody:
      type: object
      required: [motivo]
      additionalProperties: false
      properties:
        motivo:
          type: string
          enum: [danado_sin_reparacion, perdido, vendido_o_donado, obsoleto, otro]
        nota: { $ref: "#/components/schemas/NotaMotivo" }
    CrearActivoBody:
      type: object
      required: [id, codigo, nombre, precio_compra, categoria_id, ubicacion_id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Lo genera el cliente; reintentar con el mismo id no duplica. }
        codigo: { type: string, description: "1 a 40: letras sin tilde, números y - . / _; se guarda en mayúsculas." }
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        precio_compra: { $ref: "#/components/schemas/Precio" }
        categoria_id: { type: string, format: uuid }
        ubicacion_id: { type: string, format: uuid, description: Una sala o un box activos (D1). }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        marca: { $ref: "#/components/schemas/TextoOpcional" }
        modelo: { $ref: "#/components/schemas/TextoOpcional" }
        subtipo: { $ref: "#/components/schemas/TextoOpcional" }
        fecha_compra: { type: [string, "null"], format: date, description: No futura. }
    DuplicarActivoBody:
      type: object
      required: [id, codigo, copiar_de]
      additionalProperties: false
      description: >-
        El servidor copia nombre, categoría, marca, modelo, subtipo, precio y ubicación
        del original; nunca código, serial ni historial.
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        copiar_de: { type: string, format: uuid }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        ubicacion_id: { type: string, format: uuid, description: Si la unidad nueva está en otro cuarto. }
        precio_compra:
          $ref: "#/components/schemas/Precio"
          description: Solo el admin; el contador hereda el precio sin verlo (400 si lo manda).

    Health:
      type: object
      required: [status, db, version]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, error] }
        db: { type: string, enum: [ok, error] }
        version: { type: string }
    Ready:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, error] }
