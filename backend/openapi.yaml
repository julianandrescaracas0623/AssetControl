    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: Texto en español para mostrar. }
            request_id: { type: string, format: uuid }
            campo:
              type: string
              description: Campo del cuerpo que no es válido, cuando el error es de uno solo.

    Rol:
      type: string
      enum: [admin, contador]
    Usuario:
      type: object
      required: [id, email, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombre: { type: string }
    Tenant:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    UsuarioActual:
      type: object
      required: [usuario, tenant, rol, debe_cambiar_password]
      additionalProperties: false
      properties:
        usuario: { $ref: "#/components/schemas/Usuario" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        rol: { $ref: "#/components/schemas/Rol" }
        debe_cambiar_password:
          type: boolean
          description: >-
            Si es true, solo se puede cambiar la contraseña (el resto responde 403
            cambio_password_requerido).
    Sesion:
      type: object
      required: [access_token, token_type, expires_in, usuario, tenant, rol, debe_cambiar_password]
      additionalProperties: false
      properties:
        access_token: { type: string, description: JWT de acceso; solo en memoria. }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1, description: Segundos de vida del token. }
        usuario: { $ref: "#/components/schemas/Usuario" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        rol: { $ref: "#/components/schemas/Rol" }
        debe_cambiar_password:
          type: boolean
          description: >-
            Si es true, la web lleva a «Cambia tu contraseña» antes de cualquier otra
            pantalla.

    Desarrollador:
      type: object
      required: [id, email, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombre: { type: string }
    DesarrolladorActual:
      type: object
      required: [desarrollador]
      additionalProperties: false
      properties:
        desarrollador: { $ref: "#/components/schemas/Desarrollador" }
    SesionPlataforma:
      type: object
      required: [access_token, token_type, expires_in, desarrollador]
      additionalProperties: false
      properties:
        access_token: { type: string, description: JWT de acceso de plataforma; solo en memoria. }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1, description: Segundos de vida del token. }
        desarrollador: { $ref: "#/components/schemas/Desarrollador" }
    ModuloPlataforma:
      type: object
      required: [id, titulo, orden]
      additionalProperties: false
      properties:
        id: { type: string }
        titulo: { type: string }
        orden: { type: integer }
    ModulosPlataforma:
      type: object
      required: [modulos]
      additionalProperties: false
      properties:
        modulos:
          type: array
          items: { $ref: "#/components/schemas/ModuloPlataforma" }
    EmpresaPlataforma:
      type: object
      required: [id, nombre, activa, creado_en, tiene_logo, n_membresias_activas, n_admins_activos]
      additionalProperties: false
