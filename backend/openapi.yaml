# Contrato de la API de AssetControl (spec 002b, T1; R17).
#
# Escrito a mano. tests/test_openapi.py lo ata al backend: rutas de Flask iguales a
# `paths`, respuestas reales validadas contra estos esquemas y la lista de códigos
# de error igual a la del backend. La web genera sus tipos de este archivo
# (`cd web && npm run api:types`). Si cambias un endpoint, cambia aquí y regenera.
#
# En desarrollo la web llama a estas rutas con el prefijo /api (proxy de Vite).
openapi: 3.1.0
info:
  title: AssetControl API
  version: 0.1.0
  description: >-
    API de AssetControl. Toda respuesta lleva la cabecera X-Request-ID; los errores
    tienen la forma {error: {code, message, request_id}}. /auth y /invitaciones
    responden Cache-Control no-store y Referrer-Policy no-referrer y aceptan
    cuerpos de hasta 4 KB. /plataforma (consola de desarrolladores, spec 017) solo
    existe con PLATAFORMA_HABILITADA=true (si no, 404), lleva las mismas cabeceras y
    el mismo tope, y usa su propio token y su propia cookie de refresh. Spec 017 (T4):
    mientras la cuenta tenga debe_cambiar_password, todo endpoint con bearerAuth responde
    403 cambio_password_requerido (comprobación central, leída de la base en cada
    petición), salvo GET /auth/me y POST /auth/cambiar-contrasena; login, refresh y
    logout siguen sirviendo.

tags:
  - name: meta
  - name: auth
  - name: invitaciones
  - name: catalogo
  - name: activos
  - name: empresa
  - name: plataforma

paths:
  /health:
    get:
      tags: [meta]
      operationId: health
      summary: Estado de la API y de la base
      responses:
        "200":
          description: La base responde.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: La base no responde.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /ready:
    get:
      tags: [meta]
      operationId: ready
      summary: Lista para recibir tráfico (resultado guardado unos segundos)
      responses:
        "200":
          description: Lista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: No lista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginBody" }
      responses:
        "200":
          $ref: "#/components/responses/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          description: Credenciales incorrectas (mismo mensaje para cualquier causa).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [credenciales_invalidas]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Renovar la sesión con la cookie de refresh (la rota)
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          $ref: "#/components/responses/SesionIniciada"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar sesión (revoca el refresh y borra la cookie)
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Sesión cerrada, haya o no una cookie válida.
          headers:
            Set-Cookie:
              description: Borra la cookie de refresh.
              required: true
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Usuario, tenant, rol y debe_cambiar_password de la sesión (leídos de la base en cada petición)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario actual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioActual" }
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /auth/cambiar-contrasena:
    post:
      tags: [auth]
      operationId: cambiarContrasena
      summary: Cambiar la contraseña propia (obligatorio en el primer ingreso; también voluntario)
      description: >-
        Pide la contraseña actual, la nueva (política vigente, distinta de la actual) y su
        confirmación. Si cambia, quita debe_cambiar_password, cierra las demás sesiones de
        la persona y responde una sesión nueva (cookie de refresh nueva), como el login. Todo
        token de acceso emitido antes del cambio deja de servir (401 no_autenticado); el de
        la sesión nueva sí sirve. Restablecer la contraseña por correo corta igual los
        tokens anteriores. Cuenta en el mismo límite que el login.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambiarContrasenaBody" }
      responses:
        "200":
          $ref: "#/components/responses/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          description: >-
            Sin sesión (no_autenticado) o la contraseña actual no es correcta
            (credenciales_invalidas). No cambia nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [no_autenticado, credenciales_invalidas]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: >-
            La nueva no cumple la política (contrasena_*), es igual a la actual
            (contrasena_repetida) o la confirmación no coincide (contrasenas_distintas).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos:
            - contrasena_invalida
            - contrasena_corta
            - contrasena_larga
            - contrasena_comun
            - contrasena_repetida
            - contrasenas_distintas
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /auth/recuperar:
    post:
      tags: [auth]
      operationId: solicitarRecuperacion
      summary: Pedir un enlace para restablecer la contraseña (público, sin sesión)
      description: >-
        Responde siempre el mismo 202, exista o no la cuenta, esté o no activa y haya o no
        correo configurado. El enlace (30 minutos, un solo uso) llega por correo solo si la
        cuenta está activa y tiene exactamente una membresía activa.
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecuperarBody" }
      responses:
        "202":
          description: Solicitud recibida (mismo cuerpo para cualquier correo).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecuperacionSolicitada" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /auth/restablecer:
    post:
      tags: [auth]
      operationId: restablecerContrasena
      summary: Cambiar la contraseña con el token del enlace (público; no inicia sesión)
      description: >-
        Si cambia, cierra todas las sesiones de la persona y no emite cookies: entra con
        el login. Vencido, usado, invalidado, inexistente o mal formado dan el mismo 400
        enlace_invalido.
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestablecerBody" }
      responses:
        "204":
          description: Contraseña cambiada; sin cuerpo y sin Set-Cookie.
        "400":
          description: >-
            Cuerpo no válido (solicitud_invalida), contraseña fuera de la política
            (contrasena_*) o enlace no canjeable (enlace_invalido, mismo mensaje para
            cualquier causa).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos:
            - solicitud_invalida
            - contrasena_invalida
            - contrasena_corta
            - contrasena_larga
            - contrasena_comun
            - enlace_invalido
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /invitaciones:
    post:
      tags: [invitaciones]
      operationId: crearInvitacion
      summary: Invitar a una persona (solo admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitarBody" }
      responses:
        "201":
          description: >-
            Invitación creada. El enlace sale solo en esta respuesta y vence en 72 horas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitacionCreada" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /invitaciones/validar:
    post:
      tags: [invitaciones]
      operationId: validarInvitacion
      summary: Saber si un token de invitación está vigente (no lo consume)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidarBody" }
      responses:
        "200":
          description: Vencida, usada, inexistente o mal formada dan el mismo false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vigencia" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /invitaciones/aceptar:
    post:
      tags: [invitaciones]
      operationId: aceptarInvitacion
      summary: Aceptar la invitación con nombre y contraseña (sin email)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AceptarBody" }
      responses:
        "201":
          $ref: "#/components/responses/SesionIniciada"
        "400":
          description: >-
            Cuerpo o nombre no válidos (solicitud_invalida), contraseña fuera de la
            política (contrasena_*) o invitación no vigente (invitacion_invalida,
            mismo mensaje para cualquier causa).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos:
            - solicitud_invalida
            - contrasena_invalida
            - contrasena_corta
            - contrasena_larga
            - contrasena_comun
            - invitacion_invalida
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "500":
          description: >-
            La cuenta se creó pero no se pudo emitir la sesión: la persona entra con
            el login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [error_interno]
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /ubicaciones:
    get:
      tags: [catalogo]
      operationId: listarUbicaciones
      summary: Ubicaciones del tenant (el contador recibe solo las activas)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ordenadas por tipo (sede, sala, box) y nombre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaUbicaciones" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [catalogo]
      operationId: crearUbicacion
      summary: Crear una sede, sala o box (solo admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearUbicacionBody" }
      responses:
        "201":
          description: Creada y activa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UbicacionRespuesta" }
        "400":
          description: Cuerpo o nombre no válidos, o tipo y padre que no encajan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, jerarquia_invalida]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Nombre repetido entre hermanas o padre inactivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [nombre_duplicado, padre_inactivo]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /ubicaciones/{id}:
    patch:
      tags: [catalogo]
      operationId: actualizarUbicacion
      summary: Renombrar, desactivar o reactivar (solo admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActualizarUbicacionBody" }
      responses:
        "200":
          description: Actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UbicacionRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: >-
            Nombre repetido, hijas activas o activos al desactivar (D2 de la spec 004) o
            padre inactivo al reactivar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [nombre_duplicado, tiene_hijas_activas, padre_inactivo, tiene_activos]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /categorias:
    get:
      tags: [catalogo]
      operationId: listarCategorias
      summary: Categorías del tenant, por nombre
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista cerrada de la clínica.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaCategorias" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [catalogo]
      operationId: crearCategoria
      summary: Crear una categoría (solo admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NombreBody" }
      responses:
        "201":
          description: Creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriaRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/NombreDuplicado"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /categorias/{id}:
    patch:
      tags: [catalogo]
      operationId: renombrarCategoria
      summary: Renombrar una categoría (solo admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NombreBody" }
      responses:
        "200":
          description: Renombrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriaRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/NombreDuplicado"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /categorias/sugeridas:
    post:
      tags: [catalogo]
      operationId: cargarCategoriasSugeridas
      summary: Crear las 6 categorías sugeridas que falten (idempotente; solo admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista completa y cuántas se crearon ahora.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SugeridasCargadas" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"

  /activos:
    get:
      tags: [activos]
      operationId: buscarActivos
      summary: Buscar por código, nombre o serial; 25 por página, lo más reciente primero
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: estado, in: query, required: false, schema: { $ref: "#/components/schemas/EstadoActivo" } }
        - name: ubicacion_id
          in: query
          required: false
          description: Solo los activos de esa ubicación exacta (spec 005, R10).
          schema: { type: string, format: uuid }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Página de resultados (precio solo para el admin).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaActivos" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [activos]
      operationId: crearActivo
      summary: Dar de alta o duplicar un activo (admin y contador; idempotente por id)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CrearActivoBody"
                - $ref: "#/components/schemas/DuplicarActivoBody"
      responses:
        "200":
          description: Reintento con el mismo id y código; devuelve el ya guardado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "201":
          description: Creado con su evento "creado".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "400":
          description: Cuerpo, código, precio o ubicación no válidos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, codigo_invalido, precio_invalido, ubicacion_invalida]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: El código ya es de otro activo; se devuelve ese activo para abrirlo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodigoExistente" }
          x-codigos: [codigo_existente]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /activos/exportar:
    get:
      tags: [activos]
      operationId: exportarActivos
      summary: La lista de activos con los filtros vigentes, en Excel (solo admin)
      description: >-
        Spec 015 (R1, R1a; Q2–Q4). Mismos filtros, filas y orden que GET /activos, sin
        paginar. Una hoja «Activos» con código, nombre, categoría, ubicación (ruta),
        estado, serial, marca, modelo, subtipo, fecha de compra, precio de compra (número
        COP) y fecha de registro; sin fila de total; ningún texto es fórmula. Con cero
        resultados trae solo el encabezado. Nombre fijo activos-AAAAMMDD.xlsx.
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: estado, in: query, required: false, schema: { $ref: "#/components/schemas/EstadoActivo" } }
        - name: ubicacion_id
          in: query
          required: false
          description: Solo los activos de esa ubicación exacta.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Archivo de la lista (adjunto).
          headers:
            Content-Disposition:
              required: true
              description: attachment con filename ASCII fijo y filename* UTF-8.
              schema: { type: string }
            Cache-Control:
              required: true
              schema: { type: string, enum: [no-store] }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          description: >-
            Más filas que el tope técnico (5.000, Q4); hay que filtrar por búsqueda,
            estado o ubicación.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [exportacion_demasiado_grande]

  /activos/sugerencias:
    get:
      tags: [activos]
      operationId: sugerenciasActivos
      summary: Valores ya registrados de un campo, los más usados primero (hasta 8)
      security:
        - bearerAuth: []
      parameters:
        - name: campo
          in: query
          required: true
          schema: { type: string, enum: [nombre, marca, modelo, subtipo] }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
      responses:
        "200":
