      additionalProperties: false
      properties:
        activa: { type: boolean }
    EstadoEmpresa:
      type: object
      required: [id, activa]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        activa: { type: boolean }
    UsuarioPlataforma:
      type: object
      required: [id, nombre, email, rol, activa, debe_cambiar_password]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Id del usuario. }
        nombre: { type: string }
        email: { type: string }
        rol: { $ref: "#/components/schemas/Rol" }
        activa: { type: boolean, description: Si su membresía en esta empresa está activa. }
        debe_cambiar_password:
          type: boolean
          description: Cambio de contraseña pendiente (primer admin creado desde la consola o contraseña temporal definida desde Usuarios).
    ListaUsuariosPlataforma:
      type: object
      required: [usuarios]
      additionalProperties: false
      properties:
        usuarios:
          type: array
          items: { $ref: "#/components/schemas/UsuarioPlataforma" }
    EstadoUsuarioBody:
      type: object
      required: [activa]
      additionalProperties: false
      properties:
        activa: { type: boolean }
    EditarUsuarioBody:
      type: object
      required: [nombre, rol]
      additionalProperties: false
      properties:
        nombre:
          type: string
          maxLength: 120
          description: Nombre visible; se recortan los espacios y se normaliza.
        rol: { $ref: "#/components/schemas/Rol" }
    UsuarioEditado:
      type: object
      required: [id, nombre, rol]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Id del usuario. }
        nombre: { type: string }
        rol: { $ref: "#/components/schemas/Rol" }
    ContrasenaTemporalBody:
      type: object
      required: [password, password_confirmacion]
      additionalProperties: false
      properties:
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          description: Contraseña temporal; la persona debe cambiarla al entrar.
        password_confirmacion:
          type: string
          format: password
          description: Debe ser igual a password (se compara en el servidor).
    FichaEmpresaPlataforma:
      type: object
      description: La ficha de la empresa que la consola puede leer (nada más de la empresa).
      required: [nombre, direccion, nit, telefono, correo, tiene_logo]
      additionalProperties: false
      properties:
        nombre: { type: string }
        direccion: { type: string }
        nit: { type: [string, "null"], description: "Con puntos y, si lo tiene, -dígito." }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"] }
        tiene_logo: { type: boolean }
    FichaEmpresaPlataformaBody:
      type: object
      required: [nombre, direccion, nit, telefono, correo]
      additionalProperties: false
      properties:
        nombre: { type: string, description: Nombre o razón social; también el del tenant. }
        direccion: { type: string }
        nit: { type: [string, "null"] }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"] }
    LogoPlataforma:
      type: object
      required: [logo]
      additionalProperties: false
      properties:
        logo:
          type: object
          required: [id]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid, description: Id del logo vigente. }
    EstadoUsuario:
      type: object
      required: [id, activa]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Id del usuario. }
        activa: { type: boolean }
    AccionAuditoria:
      type: string
      description: Lista cerrada de acciones auditadas de la consola y del operador (R33).
      enum:
        - login_ok
        - empresa_creada
        - empresa_desactivada
        - empresa_reactivada
        - empresa_logo_subido
        - usuario_desactivado
        - usuario_reactivado
        - desarrollador_creado
        - desarrollador_restablecido
        - desarrollador_desactivado
        - desarrollador_reactivado
        - empresa_editada
        - empresa_logo_reemplazado
        - usuario_editado
        - usuario_contrasena_restablecida
    RegistroActividad:
      type: object
      required:
        - id
        - fecha
        - accion
        - resultado
        - desarrollador_nombre
        - empresa_id
        - empresa_nombre
        - objeto_id
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Id del registro de auditoría. }
        fecha: { type: string, format: date-time, description: Instante en UTC. }
        accion: { $ref: "#/components/schemas/AccionAuditoria" }
        resultado: { type: string, enum: [ok, rechazado] }
        desarrollador_nombre:
          type: string
          description: Nombre del desarrollador, u «Operador» si la hizo el operador por CLI.
        empresa_id: { type: [string, "null"], format: uuid }
        empresa_nombre: { type: [string, "null"] }
        objeto_id:
          type: [string, "null"]
          format: uuid
          description: >-
            Id del objeto de la acción (empresa, usuario o desarrollador; en
            empresa_logo_subido y empresa_logo_reemplazado, el id del logo nuevo; nulo en
            empresa_editada). En las acciones del operador por CLI sobre
            un desarrollador (desarrollador_nombre «Operador») puede ser el id del
            desarrollador objetivo.
    ActividadPlataforma:
      type: object
      required: [actividad, siguiente]
      additionalProperties: false
      properties:
        actividad:
          type: array
          items: { $ref: "#/components/schemas/RegistroActividad" }
        siguiente:
          type: [string, "null"]
          description: Cursor de la página siguiente; nulo si no hay más.

    LoginBody:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string, format: password }
    InvitarBody:
      type: object
      required: [email, rol]
      additionalProperties: false
      properties:
        email: { type: string }
        rol: { $ref: "#/components/schemas/Rol" }
    ValidarBody:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: Token del fragmento del enlace. }
    AceptarBody:
      type: object
      required: [token, nombre, password]
      additionalProperties: false
      properties:
        token: { type: string }
        nombre:
          type: string
          maxLength: 120
          description: >-
            Nombre visible: se guarda en NFC y sin espacios en los extremos; necesita una
            letra o un número y no admite caracteres invisibles o de control.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    CambiarContrasenaBody:
      type: object
      required: [actual, nueva, confirmacion]
      additionalProperties: false
      properties:
        actual: { type: string, format: password }
        nueva: { type: string, format: password, minLength: 10, maxLength: 128 }
        confirmacion: { type: string, format: password }
    RecuperarBody:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string }
    RecuperacionSolicitada:
      type: object
      required: [mensaje]
      additionalProperties: false
      properties:
        mensaje: { type: string, description: Texto genérico en español para mostrar. }
    RestablecerBody:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          description: >-
            Token del fragmento del enlace (/restablecer#token); va solo en el cuerpo,
            nunca en la URL.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128

    Invitacion:
      type: object
      required: [id, email, rol, expira_en]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        rol: { $ref: "#/components/schemas/Rol" }
        expira_en: { type: string, format: date-time }
    InvitacionCreada:
      type: object
      required: [invitacion, enlace]
      additionalProperties: false
      properties:
        invitacion: { $ref: "#/components/schemas/Invitacion" }
        enlace:
          type: string
          description: Ruta relativa /invitacion#<token>; se muestra una sola vez.
    Vigencia:
      type: object
      required: [vigente]
      additionalProperties: false
      properties:
        vigente: { type: boolean }

    NombreVisible:
      type: string
      maxLength: 120
      description: >-
        Se guarda en NFC y sin espacios en los extremos; necesita una letra o un número
        y no admite caracteres invisibles o de control.
    TipoUbicacion:
      type: string
      enum: [sede, sala, box]
    Ubicacion:
      type: object
      required: [id, nombre, tipo, padre_id, activa]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { $ref: "#/components/schemas/TipoUbicacion" }
        padre_id:
          type: [string, "null"]
          format: uuid
          description: Null solo en una sede.
        activa: { type: boolean }
    UbicacionRespuesta:
      type: object
      required: [ubicacion]
      additionalProperties: false
      properties:
        ubicacion: { $ref: "#/components/schemas/Ubicacion" }
    ListaUbicaciones:
      type: object
      required: [ubicaciones]
      additionalProperties: false
      properties:
        ubicaciones:
          type: array
          items: { $ref: "#/components/schemas/Ubicacion" }
    CrearUbicacionBody:
      type: object
      required: [nombre, tipo]
      additionalProperties: false
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        tipo: { $ref: "#/components/schemas/TipoUbicacion" }
        padre_id:
          type: string
          format: uuid
          description: Obligatorio para sala (una sede) y box (una sala); prohibido en sede.
    ActualizarUbicacionBody:
      type: object
      additionalProperties: false
      description: Al menos uno de los dos campos.
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        activa: { type: boolean }

    Categoria:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    CategoriaRespuesta:
      type: object
      required: [categoria]
      additionalProperties: false
      properties:
        categoria: { $ref: "#/components/schemas/Categoria" }
    ListaCategorias:
      type: object
      required: [categorias]
      additionalProperties: false
      properties:
        categorias:
          type: array
          items: { $ref: "#/components/schemas/Categoria" }
    SugeridasCargadas:
      type: object
      required: [categorias, creadas]
      additionalProperties: false
      properties:
        categorias:
          type: array
          items: { $ref: "#/components/schemas/Categoria" }
        creadas: { type: integer, minimum: 0 }
    NombreBody:
      type: object
      required: [nombre]
      additionalProperties: false
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }

    Precio:
      type: string
      description: >-
        Decimal en texto canónico ("1390000.50"), mayor o igual a 0 y con hasta dos
        decimales. Nunca un número JSON.
    EstadoActivo:
      type: string
      enum: [activo, en_reparacion, dado_de_baja]
    TextoOpcional:
      type: [string, "null"]
      maxLength: 120
    Activo:
      type: object
      required:
        [id, codigo, nombre, categoria, ubicacion, serial, marca, modelo, subtipo, fecha_compra, estado, row_version, creado_en]
      additionalProperties: false
      description: precio_compra solo existe en las respuestas al admin (P13).
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        ubicacion: { $ref: "#/components/schemas/UbicacionDeActivo" }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        marca: { $ref: "#/components/schemas/TextoOpcional" }
        modelo: { $ref: "#/components/schemas/TextoOpcional" }
        subtipo: { $ref: "#/components/schemas/TextoOpcional" }
        fecha_compra: { type: [string, "null"], format: date }
        estado: { $ref: "#/components/schemas/EstadoActivo" }
        row_version:
          type: integer
          minimum: 1
          description: Versión para If-Match al cambiar el activo (spec 005).
        creado_en: { type: string, format: date-time }
        precio_compra: { $ref: "#/components/schemas/Precio" }
        foto:
          description: >-
            Foto principal vigente (spec 012); viene en la ficha, en por-codigo y en la
            respuesta de editar, mover, estado, baja y su 412 (spec 015, R4). No viene en la
            búsqueda ni en el alta.
          oneOf:
            - { $ref: "#/components/schemas/Foto" }
            - { type: "null" }
    Foto:
      type: object
      required: [id, creada_en, ancho, alto]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        creada_en: { type: string, format: date-time }
        ancho: { type: integer, minimum: 1 }
        alto: { type: integer, minimum: 1 }
    FotoRespuesta:
      type: object
      required: [foto]
      additionalProperties: false
      properties:
        foto: { $ref: "#/components/schemas/Foto" }
    SubirFotoBody:
      type: object
      required: [foto_id, archivo]
      additionalProperties: false
      properties:
        foto_id: { type: string, format: uuid }
        archivo: { type: string, description: "Archivo de imagen (binario)." }
    Empresa:
      type: object
      required: [nombre, direccion, nit, telefono, correo, logo, completa]
      additionalProperties: false
      properties:
        nombre: { type: string }
        direccion: { type: [string, "null"] }
        nit: { type: [string, "null"], description: "Con puntos y, si lo tiene, -dígito." }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"] }
        logo:
          oneOf:
            - type: "null"
            - type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
        completa: { type: boolean, description: "false hasta guardar nombre y dirección." }
    EmpresaDelInforme:
      type: object
      description: >-
        Datos de la empresa congelados al cerrar (spec 013). vigente true: la sesión se
        cerró antes de guardarlos y se muestran los de hoy.
      required: [nombre, direccion, nit, telefono, correo, logo, vigente]
      additionalProperties: false
      properties:
        nombre: { type: string }
        direccion: { type: [string, "null"] }
        nit: { type: [string, "null"] }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"] }
        logo:
          oneOf:
            - type: "null"
            - type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
        vigente: { type: boolean }
    EmpresaRespuesta:
      type: object
      required: [empresa]
      additionalProperties: false
      properties:
        empresa: { $ref: "#/components/schemas/Empresa" }
    GuardarEmpresaBody:
      type: object
      required: [nombre, direccion]
      additionalProperties: false
      properties:
        nombre: { type: string }
        direccion: { type: string }
        nit: { type: [string, "null"] }
        telefono: { type: [string, "null"] }
        correo: { type: [string, "null"] }
    SubirLogoBody:
      type: object
      required: [logo_id, archivo]
      additionalProperties: false
      properties:
        logo_id: { type: string, format: uuid }
        archivo: { type: string, description: "Archivo de imagen (binario)." }
    LogoRespuesta:
      type: object
      required: [logo]
      additionalProperties: false
      properties:
        logo:
          type: object
          required: [id, ancho, alto]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            ancho: { type: integer }
            alto: { type: integer }
    UbicacionDeActivo:
      type: object
      required: [id, nombre, ruta]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        ruta: { type: string, description: '"Sala › Box" o el nombre de la sala.' }
    ListaActivos:
      type: object
      required: [activos, total, pagina, por_pagina]
      additionalProperties: false
      properties:
        activos:
          type: array
          items: { $ref: "#/components/schemas/Activo" }
        total: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 1 }
        por_pagina: { type: integer, minimum: 1 }
    Sugerencias:
      type: object
      required: [valores]
      additionalProperties: false
      properties:
        valores:
          type: array
          items: { type: string }
    ActivoRespuesta:
      type: object
      required: [activo]
      additionalProperties: false
      properties:
        activo: { $ref: "#/components/schemas/Activo" }
    ActivoResumen:
      type: object
      required: [id, codigo, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
    CodigoExistente:
      type: object
      required: [error, activo]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            request_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/ActivoResumen" }
    VersionDesactualizada:
      type: object
      required: [error, activo]
      additionalProperties: false
      description: El activo cambió desde que se leyó; trae el vigente (con precio, solo admin).
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            request_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/Activo" }
    EditarActivoBody:
      type: object
      additionalProperties: false
      description: >-
        Solo los campos que cambian; null o "" borra un opcional. El código no se puede
        cambiar (400 codigo_inmutable).
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        categoria_id: { type: string, format: uuid }
        precio_compra: { $ref: "#/components/schemas/Precio" }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        marca: { $ref: "#/components/schemas/TextoOpcional" }
        modelo: { $ref: "#/components/schemas/TextoOpcional" }
        subtipo: { $ref: "#/components/schemas/TextoOpcional" }
        fecha_compra: { type: [string, "null"], format: date, description: No futura. }
    Autor:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    SesionConteo:
      type: object
      required: [id, nombre, tipo, estado, fecha_corte, abierta_por, abierta_en, cerrada_por, cerrada_en]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        tipo: { type: string, enum: [conteo, importacion] }
        estado: { type: string, enum: [abierta, cerrada] }
        fecha_corte: { type: string, format: date }
        abierta_por: { $ref: "#/components/schemas/Autor" }
        abierta_en: { type: string, format: date-time }
        cerrada_por:
          oneOf:
            - { $ref: "#/components/schemas/Autor" }
            - { type: "null" }
        cerrada_en: { type: [string, "null"], format: date-time }
    SesionConteoRespuesta:
      type: object
      required: [sesion]
      additionalProperties: false
      properties:
        sesion: { $ref: "#/components/schemas/SesionConteo" }
    SesionAbierta:
      type: object
      required: [sesion]
      additionalProperties: false
      properties:
        sesion:
          oneOf:
            - { $ref: "#/components/schemas/SesionConteo" }
            - { type: "null" }
    ListaSesiones:
      type: object
      required: [sesiones]
      additionalProperties: false
      properties:
        sesiones:
          type: array
          items: { $ref: "#/components/schemas/SesionConteo" }
    AbrirSesionBody:
      type: object
      required: [nombre, fecha_corte]
      additionalProperties: false
      properties:
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        fecha_corte: { type: string, format: date, description: Fecha a la que se refiere el informe. }
    AvanceUbicacion:
      type: object
      required: [ubicacion, total, verificados, pendientes]
      additionalProperties: false
      properties:
        ubicacion:
          type: object
          required: [id, ruta]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            ruta: { type: string }
        total: { type: integer, minimum: 0 }
        verificados: { type: integer, minimum: 0 }
        pendientes: { type: integer, minimum: 0 }
    Avance:
      type: object
      required: [total, verificados, pendientes, por_ubicacion]
      additionalProperties: false
      description: >-
        Activos activo o en_reparacion por su ubicación vigente y cuántos tienen
        verificación en la sesión. Información de trabajo; no es el informe.
      properties:
        total: { type: integer, minimum: 0 }
        verificados: { type: integer, minimum: 0 }
        pendientes: { type: integer, minimum: 0 }
        por_ubicacion:
          type: array
          items: { $ref: "#/components/schemas/AvanceUbicacion" }
    DetalleSesion:
      type: object
      required: [sesion, avance]
      additionalProperties: false
      properties:
        sesion: { $ref: "#/components/schemas/SesionConteo" }
        avance: { $ref: "#/components/schemas/Avance" }
    UbicacionRuta:
      type: object
      required: [id, ruta]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        ruta: { type: string }
    Verificacion:
      type: object
      required:
        [id, sesion_id, activo, ubicacion_esperada, ubicacion_encontrada, estado_fisico, nota, verificado_por, ocurrido_en, recibido_en, seq, foto_id]
      additionalProperties: false
      description: precio_al_contar solo existe en las respuestas al admin (P13).
      properties:
        id: { type: string, format: uuid }
        sesion_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/ActivoResumen" }
        ubicacion_esperada: { $ref: "#/components/schemas/UbicacionRuta" }
        ubicacion_encontrada: { $ref: "#/components/schemas/UbicacionRuta" }
        estado_fisico: { $ref: "#/components/schemas/EstadoFisico" }
        nota: { $ref: "#/components/schemas/NotaMotivo" }
        verificado_por: { $ref: "#/components/schemas/Autor" }
        ocurrido_en: { type: [string, "null"], format: date-time }
        recibido_en: { type: string, format: date-time }
        seq: { type: integer, minimum: 1 }
        foto_id:
          type: [string, "null"]
          format: uuid
          description: Foto opcional de esta verificación (spec 012).
        precio_al_contar: { $ref: "#/components/schemas/Precio" }
    EstadoFisico:
      type: string
      enum: [ok, danado]
    VerificacionRespuesta:
      type: object
      required: [verificacion]
      additionalProperties: false
      properties:
        verificacion: { $ref: "#/components/schemas/Verificacion" }
    UltimaVerificacion:
      type: object
      required: [verificacion]
      additionalProperties: false
      properties:
        verificacion:
          oneOf:
            - { $ref: "#/components/schemas/Verificacion" }
            - { type: "null" }
    VerificarBody:
      type: object
      required: [id, activo_id, ubicacion_encontrada_id, estado_fisico]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Lo genera el cliente; reintentar con el mismo id no duplica. }
        activo_id: { type: string, format: uuid }
        ubicacion_encontrada_id: { type: string, format: uuid, description: Sala o box activos donde se vio. }
        estado_fisico: { $ref: "#/components/schemas/EstadoFisico" }
        nota: { $ref: "#/components/schemas/NotaMotivo" }
        ocurrido_en: { type: [string, "null"], format: date-time, description: "Reloj del cliente, informativo." }
    ActivoConEstado:
      type: object
      required: [id, codigo, nombre, estado]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        estado: { $ref: "#/components/schemas/EstadoActivo" }
    Discrepancia:
      type: object
      required:
        [verificacion_id, activo, ubicacion_esperada, ubicacion_encontrada, ubicacion_actual, verificado_por, recibido_en, estado, resolucion]
      additionalProperties: false
      properties:
        verificacion_id: { type: string, format: uuid }
        activo: { $ref: "#/components/schemas/ActivoConEstado" }
        ubicacion_esperada: { $ref: "#/components/schemas/UbicacionRuta" }
        ubicacion_encontrada: { $ref: "#/components/schemas/UbicacionRuta" }
        ubicacion_actual: { $ref: "#/components/schemas/UbicacionRuta" }
        verificado_por: { $ref: "#/components/schemas/Autor" }
        recibido_en: { type: string, format: date-time }
        estado: { type: string, enum: [pendiente, desfasada, aplicada, descartada] }
        resolucion:
          oneOf:
            - type: object
              required: [tipo, por, en]
              additionalProperties: false
              properties:
                tipo: { type: string, enum: [aplicada, descartada] }
                por: { $ref: "#/components/schemas/Autor" }
                en: { type: string, format: date-time }
            - { type: "null" }
    ListaDiscrepancias:
      type: object
      required: [discrepancias]
      additionalProperties: false
      properties:
        discrepancias:
          type: array
          items: { $ref: "#/components/schemas/Discrepancia" }
    AplicarDiscrepanciasBody:
      type: object
      required: [verificaciones]
      additionalProperties: false
      properties:
        verificaciones:
          type: array
          description: De 1 a 100 ids de verificación, sin repetir.
          items: { type: string, format: uuid }
        confirmar_desfase:
          type: boolean
          description: Aplicar aunque el activo ya no esté en la ubicación esperada.
    DescartarDiscrepanciasBody:
      type: object
      required: [verificaciones]
      additionalProperties: false
      properties:
        verificaciones:
          type: array
          description: De 1 a 100 ids de verificación, sin repetir.
          items: { type: string, format: uuid }
    ResultadosDiscrepancias:
      type: object
      required: [resultados]
      additionalProperties: false
      properties:
        resultados:
          type: array
          items:
            type: object
            required: [verificacion_id, resultado]
            additionalProperties: false
            properties:
              verificacion_id: { type: string, format: uuid }
              resultado:
                type: string
                enum:
                  - aplicada
                  - descartada
                  - desfasada
                  - ya_en_la_encontrada
                  - ya_resuelta
                  - ya_no_es_discrepancia
                  - dado_de_baja
                  - ubicacion_invalida
                  - no_encontrada
              activo:
                type: object
                required: [id, codigo, nombre, ubicacion]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
                  codigo: { type: string }
                  nombre: { type: string }
                  ubicacion: { $ref: "#/components/schemas/UbicacionRuta" }
    Pendiente:
      type: object
      required: [id, codigo, nombre, categoria, ubicacion, estado]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        ubicacion: { $ref: "#/components/schemas/UbicacionRuta" }
        estado: { $ref: "#/components/schemas/EstadoActivo" }
    ListaPendientes:
      type: object
      required: [activos, total, pagina, por_pagina]
      additionalProperties: false
      properties:
        activos:
          type: array
          items: { $ref: "#/components/schemas/Pendiente" }
        total: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 1 }
        por_pagina: { type: integer, minimum: 1 }
    Cifras:
      type: object
      required: [encontrado, no_encontrado, registrado, unidades_encontrado, unidades_no_encontrado, unidades_registrado]
      additionalProperties: false
      properties:
        encontrado: { $ref: "#/components/schemas/Precio" }
        no_encontrado: { $ref: "#/components/schemas/Precio" }
        registrado: { $ref: "#/components/schemas/Precio" }
        unidades_encontrado: { type: integer, minimum: 0 }
        unidades_no_encontrado: { type: integer, minimum: 0 }
        unidades_registrado: { type: integer, minimum: 0 }
    FilaDesglose:
      type: object
      required: [id, etiqueta, total_encontrado, total_no_encontrado, total_registrado, unidades_encontrado, unidades_no_encontrado, unidades_registrado]
      additionalProperties: false
      description: etiqueta es el nombre de la categoría o la ruta de la ubicación al cierre.
      properties:
        id: { type: string, format: uuid }
        etiqueta: { type: string }
        total_encontrado: { $ref: "#/components/schemas/Precio" }
        total_no_encontrado: { $ref: "#/components/schemas/Precio" }
        total_registrado: { $ref: "#/components/schemas/Precio" }
        unidades_encontrado: { type: integer, minimum: 0 }
        unidades_no_encontrado: { type: integer, minimum: 0 }
        unidades_registrado: { type: integer, minimum: 0 }
    NoEncontrado:
      type: object
      required: [activo_id, codigo, nombre, categoria, ubicacion, precio, en_reparacion]
      additionalProperties: false
      properties:
        activo_id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        categoria: { $ref: "#/components/schemas/Categoria" }
        ubicacion: { $ref: "#/components/schemas/UbicacionRuta" }
        precio: { $ref: "#/components/schemas/Precio" }
        en_reparacion: { type: boolean }
    Informe:
      type: object
      required: [sesion, empresa, detalle_disponible, totales, desglose, no_encontrados]
      additionalProperties: false
      properties:
        sesion: { $ref: "#/components/schemas/SesionConteo" }
        empresa: { $ref: "#/components/schemas/EmpresaDelInforme" }
        detalle_disponible:
          type: boolean
          description: >-
            false en sesiones cerradas antes de la spec 013: no guardaron el detalle por
            activo ni la copia de la empresa.
        totales: { $ref: "#/components/schemas/Cifras" }
        desglose:
          type: object
          required: [categorias, ubicaciones]
          additionalProperties: false
          properties:
            categorias:
              type: array
              items: { $ref: "#/components/schemas/FilaDesglose" }
            ubicaciones:
              type: array
              items: { $ref: "#/components/schemas/FilaDesglose" }
        no_encontrados:
          type: array
          items: { $ref: "#/components/schemas/NoEncontrado" }
    FilaValor:
      type: object
      required: [id, etiqueta, valor, unidades]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        etiqueta: { type: string }
        valor: { $ref: "#/components/schemas/Precio" }
        unidades: { type: integer, minimum: 0 }
    ValorActual:
      type: object
      required: [total, unidades, en_reparacion, por_categoria, por_ubicacion, calculado_en]
      additionalProperties: false
      properties:
        total: { $ref: "#/components/schemas/Precio" }
        unidades: { type: integer, minimum: 0 }
        en_reparacion:
          type: object
          required: [valor, unidades]
          additionalProperties: false
          properties:
            valor: { $ref: "#/components/schemas/Precio" }
            unidades: { type: integer, minimum: 0 }
        por_categoria:
          type: array
          items: { $ref: "#/components/schemas/FilaValor" }
        por_ubicacion:
          type: array
          items: { $ref: "#/components/schemas/FilaValor" }
        calculado_en: { type: string, format: date-time }
    RefSesion:
      type: object
      required: [id, nombre]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
    Porcentaje:
      type: string
      description: Porcentaje con un decimal y punto ("33.3"), calculado por el servidor.
    Inicio:
      type: object
      required: [activos_hoy, sesion_abierta]
      additionalProperties: false
      properties:
        activos_hoy:
          type: object
          required: [unidades, en_reparacion]
          additionalProperties: false
          properties:
            unidades: { type: integer, minimum: 0 }
            en_reparacion: { type: integer, minimum: 0 }
        sesion_abierta:
          oneOf:
            - type: object
              required: [id, nombre, fecha_corte, avance]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
                nombre: { type: string }
                fecha_corte: { type: string, format: date }
                avance:
                  type: object
                  required: [total, verificados, pendientes, porcentaje]
                  additionalProperties: false
                  properties:
                    total: { type: integer, minimum: 0 }
                    verificados: { type: integer, minimum: 0 }
                    pendientes: { type: integer, minimum: 0 }
                    porcentaje: { $ref: "#/components/schemas/Porcentaje" }
            - { type: "null" }
        valor_actual:
          type: object
          description: Solo admin. Valor vivo (R7); no es el informe.
          required: [total, unidades, calculado_en]
          additionalProperties: false
          properties:
            total: { $ref: "#/components/schemas/Precio" }
            unidades: { type: integer, minimum: 0 }
            calculado_en: { type: string, format: date-time }
        discrepancias:
          description: Solo admin. Por resolver en la sesión de referencia (abierta o última cerrada).
          oneOf:
            - type: object
              required: [por_resolver, sesion]
              additionalProperties: false
              properties:
                por_resolver: { type: integer, minimum: 0 }
                sesion: { $ref: "#/components/schemas/RefSesion" }
            - { type: "null" }
        danados:
          type: object
          description: Solo admin. En reparación ∪ dañados en la sesión de referencia (P26).
          required: [total, en_reparacion, danados, sesion]
          additionalProperties: false
          properties:
            total: { type: integer, minimum: 0 }
            en_reparacion: { type: integer, minimum: 0 }
            danados: { type: integer, minimum: 0 }
            sesion:
              oneOf:
                - { $ref: "#/components/schemas/RefSesion" }
                - { type: "null" }
        ultimo_informe:
          description: Solo admin. Tres cifras congeladas del último cierre de tipo conteo.
          oneOf:
            - type: object
              required: [sesion, totales]
              additionalProperties: false
              properties:
                sesion: { $ref: "#/components/schemas/SesionConteo" }
                totales: { $ref: "#/components/schemas/Cifras" }
            - { type: "null" }
    EventoActividad:
      type: object
      required: [seq, tipo, ocurrido_en, autor, datos, activo]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        tipo: { $ref: "#/components/schemas/TipoEvento" }
        ocurrido_en: { type: string, format: date-time }
        autor:
          type: object
          required: [id, nombre]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        datos:
          type: object
          description: Contenido por tipo (docs/03, spec 005); sin precios para el contador.
        activo:
          type: object
          required: [id, codigo, nombre]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            codigo: { type: string }
            nombre: { type: string }
    Actividad:
      type: object
      required: [eventos, siguiente]
      additionalProperties: false
      properties:
        eventos:
          type: array
          items: { $ref: "#/components/schemas/EventoActividad" }
        siguiente:
          type: [integer, "null"]
          description: Cursor para la página siguiente (antes_de); null si no hay más.
    Evolucion:
      type: object
      required: [sesiones, por_categoria]
      additionalProperties: false
      properties:
        sesiones:
          type: array
          items:
            type: object
            required: [sesion, total_registrado, unidades_registrado, unidades_encontrado, porcentaje_encontrado]
            additionalProperties: false
            properties:
              sesion:
                type: object
                required: [id, nombre, fecha_corte, cerrada_en]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
                  nombre: { type: string }
                  fecha_corte: { type: string, format: date }
                  cerrada_en: { type: [string, "null"], format: date-time }
              total_registrado: { $ref: "#/components/schemas/Precio" }
              unidades_registrado: { type: integer, minimum: 0 }
              unidades_encontrado: { type: integer, minimum: 0 }
              porcentaje_encontrado: { $ref: "#/components/schemas/Porcentaje" }
        por_categoria:
          type: array
          items:
            type: object
            required: [categoria_id, etiqueta, puntos]
            additionalProperties: false
            properties:
              categoria_id: { type: string, format: uuid }
              etiqueta: { type: string, description: Nombre al cierre más reciente en que aparece. }
              puntos:
                type: array
                items:
                  type: object
                  required: [sesion_id, total_registrado, unidades_registrado]
                  additionalProperties: false
                  properties:
                    sesion_id: { type: string, format: uuid }
                    total_registrado: { $ref: "#/components/schemas/Precio" }
                    unidades_registrado: { type: integer, minimum: 0 }
    TipoEvento:
      type: string
      enum:
        - creado
        - importado
        - verificado
        - ubicacion_cambiada
        - precio_cambiado
        - estado_cambiado
        - categoria_cambiada
        - datos_cambiados
        - dado_de_baja
        - discrepancia_descartada
        - foto_agregada
        - foto_cambiada
        - foto_retirada
    EventoActivo:
      type: object
      required: [seq, tipo, ocurrido_en, autor, datos]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        tipo: { $ref: "#/components/schemas/TipoEvento" }
        ocurrido_en: { type: string, format: date-time }
        autor:
          type: object
          required: [id, nombre]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
        datos:
          type: object
          description: Contenido por tipo (docs/03, spec 005); sin precios para el contador.
        foto_id:
          type: string
          format: uuid
          description: Foto de la verificación del evento, si la tiene (spec 012).
    Historial:
      type: object
      required: [eventos, siguiente]
      additionalProperties: false
      properties:
        eventos:
          type: array
          items: { $ref: "#/components/schemas/EventoActivo" }
        siguiente:
          type: [integer, "null"]
          description: Cursor para la página siguiente (antes_de); null si no hay más.
    MoverActivoBody:
      type: object
      required: [ubicacion_id]
      additionalProperties: false
      properties:
        ubicacion_id: { type: string, format: uuid, description: Una sala o un box activos (D1). }
    NotaMotivo:
      type: [string, "null"]
      maxLength: 120
      description: Texto corto (H-3); en una baja o reactivación, obligatoria si el motivo es "otro".
    EstadoActivoBody:
      type: object
      required: [estado]
      additionalProperties: false
      description: >-
        Entre activo y en_reparacion sin motivo. Un dado de baja solo pasa a activo y con
        motivo (reactivar).
      properties:
        estado: { type: string, enum: [activo, en_reparacion] }
        motivo: { type: string, enum: [encontrado, baja_por_error, otro] }
        nota: { $ref: "#/components/schemas/NotaMotivo" }
    BajaActivoBody:
      type: object
      required: [motivo]
      additionalProperties: false
      properties:
        motivo:
          type: string
          enum: [danado_sin_reparacion, perdido, vendido_o_donado, obsoleto, otro]
        nota: { $ref: "#/components/schemas/NotaMotivo" }
    CrearActivoBody:
      type: object
      required: [id, codigo, nombre, precio_compra, categoria_id, ubicacion_id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Lo genera el cliente; reintentar con el mismo id no duplica. }
        codigo: { type: string, description: "1 a 40: letras sin tilde, números y - . / _; se guarda en mayúsculas." }
        nombre: { $ref: "#/components/schemas/NombreVisible" }
        precio_compra: { $ref: "#/components/schemas/Precio" }
        categoria_id: { type: string, format: uuid }
        ubicacion_id: { type: string, format: uuid, description: Una sala o un box activos (D1). }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        marca: { $ref: "#/components/schemas/TextoOpcional" }
        modelo: { $ref: "#/components/schemas/TextoOpcional" }
        subtipo: { $ref: "#/components/schemas/TextoOpcional" }
        fecha_compra: { type: [string, "null"], format: date, description: No futura. }
    DuplicarActivoBody:
      type: object
      required: [id, codigo, copiar_de]
      additionalProperties: false
      description: >-
        El servidor copia nombre, categoría, marca, modelo, subtipo, precio y ubicación
        del original; nunca código, serial ni historial.
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        copiar_de: { type: string, format: uuid }
        serial: { $ref: "#/components/schemas/TextoOpcional" }
        ubicacion_id: { type: string, format: uuid, description: Si la unidad nueva está en otro cuarto. }
        precio_compra:
          $ref: "#/components/schemas/Precio"
          description: Solo el admin; el contador hereda el precio sin verlo (400 si lo manda).

    Health:
      type: object
      required: [status, db, version]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, error] }
        db: { type: string, enum: [ok, error] }
        version: { type: string }
    Ready:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, error] }
