        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ActivoDadoDeBaja"
        "412":
          $ref: "#/components/responses/VersionDesactualizada"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "428":
          $ref: "#/components/responses/FaltaVersion"

  /activos/{id}/foto:
    put:
      tags: [fotos]
      operationId: subirFotoActivo
      summary: Crear o cambiar la foto principal (admin y contador; spec 012)
      description: >-
        multipart/form-data con foto_id (UUID del cliente: reintentar con el mismo no
        duplica) y archivo (JPEG, PNG o WebP, hasta 10 MB). El servidor la vuelve a
        codificar en JPEG sin metadatos (lado ≤ 1600 px y miniatura de 320). Si ya había
        una principal, queda retirada y su imagen se borra (evento foto_cambiada).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SubirFotoBody" }
      responses:
        "200":
          $ref: "#/components/responses/FotoGuardada"
        "201":
          $ref: "#/components/responses/FotoGuardada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Activo dado de baja o foto_id ya usado en otro activo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [activo_dado_de_baja, foto_id_en_uso]
        "413":
          $ref: "#/components/responses/FotoDemasiadoGrande"
        "415":
          $ref: "#/components/responses/FotoTipoNoAdmitido"
        "422":
          $ref: "#/components/responses/FotoInvalida"
        "503":
          $ref: "#/components/responses/FotosNoDisponibles"
    delete:
      tags: [fotos]
      operationId: quitarFotoActivo
      summary: Quitar la foto principal (admin y contador; su imagen se borra)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Foto quitada (evento foto_retirada).
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: El activo no existe o no tiene foto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [no_encontrado, sin_foto]
        "503":
          $ref: "#/components/responses/FotosNoDisponibles"

  /sesiones/{sid}/verificaciones/{vid}/foto:
    put:
      tags: [fotos]
      operationId: subirFotoVerificacion
      summary: Foto opcional de una verificación (quien verificó o un admin; sesión abierta)
      security:
        - bearerAuth: []
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SubirFotoBody" }
      responses:
        "200":
          $ref: "#/components/responses/FotoGuardada"
        "201":
          $ref: "#/components/responses/FotoGuardada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Sesión cerrada, la verificación ya tiene foto o foto_id usado en otra.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [sesion_cerrada, foto_existente, foto_id_en_uso]
        "413":
          $ref: "#/components/responses/FotoDemasiadoGrande"
        "415":
          $ref: "#/components/responses/FotoTipoNoAdmitido"
        "422":
          $ref: "#/components/responses/FotoInvalida"
        "503":
          $ref: "#/components/responses/FotosNoDisponibles"

  /fotos/{id}:
    get:
      tags: [fotos]
      operationId: verFoto
      summary: La imagen de una foto vigente del tenant (JPEG; privada)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: tamano
          in: query
          required: false
          schema: { type: string, enum: [completa, mini] }
      responses:
        "200":
          description: La imagen. Una foto nunca cambia (cambiarla crea otra con otro id).
          headers:
            Cache-Control:
              required: true
              schema: { type: string, enum: ["private, max-age=86400"] }
            X-Content-Type-Options:
              required: true
              schema: { type: string, enum: [nosniff] }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: No existe, es de otro tenant o se retiró.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [sin_foto]
        "503":
          $ref: "#/components/responses/FotosNoDisponibles"

