# Contrato de la API de AssetControl (spec 002b, T1; R17).
#
# Escrito a mano. tests/test_openapi.py lo ata al backend: rutas de Flask iguales a
# `paths`, respuestas reales validadas contra estos esquemas y la lista de códigos
# de error igual a la del backend. La web genera sus tipos de este archivo
# (`cd web && npm run api:types`). Si cambias un endpoint, cambia aquí y regenera.
#
# En desarrollo la web llama a estas rutas con el prefijo /api (proxy de Vite).
openapi: 3.1.0
info:
  title: AssetControl API
  version: 0.1.0
  description: >-
    API de AssetControl. Toda respuesta lleva la cabecera X-Request-ID; los errores
    tienen la forma {error: {code, message, request_id}}. /auth y /invitaciones
    responden Cache-Control no-store y Referrer-Policy no-referrer y aceptan
    cuerpos de hasta 4 KB.

tags:
  - name: meta
  - name: auth
  - name: invitaciones
  - name: catalogo
  - name: activos
  - name: empresa

paths:
  /health:
    get:
      tags: [meta]
      operationId: health
      summary: Estado de la API y de la base
      responses:
        "200":
          description: La base responde.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: La base no responde.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /ready:
    get:
      tags: [meta]
      operationId: ready
      summary: Lista para recibir tráfico (resultado guardado unos segundos)
      responses:
        "200":
          description: Lista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: No lista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginBody" }
      responses:
        "200":
          $ref: "#/components/responses/SesionIniciada"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          description: Credenciales incorrectas (mismo mensaje para cualquier causa).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [credenciales_invalidas]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Renovar la sesión con la cookie de refresh (la rota)
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          $ref: "#/components/responses/SesionIniciada"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar sesión (revoca el refresh y borra la cookie)
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "204":
          description: Sesión cerrada, haya o no una cookie válida.
          headers:
            Set-Cookie:
              description: Borra la cookie de refresh.
              required: true
              schema: { type: string }
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Usuario, tenant y rol de la sesión (leídos de la base en cada petición)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario actual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioActual" }
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /invitaciones:
    post:
      tags: [invitaciones]
      operationId: crearInvitacion
      summary: Invitar a una persona (solo admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitarBody" }
      responses:
        "201":
          description: >-
            Invitación creada. El enlace sale solo en esta respuesta y vence en 72 horas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitacionCreada" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /invitaciones/validar:
    post:
      tags: [invitaciones]
      operationId: validarInvitacion
      summary: Saber si un token de invitación está vigente (no lo consume)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidarBody" }
      responses:
        "200":
          description: Vencida, usada, inexistente o mal formada dan el mismo false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vigencia" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /invitaciones/aceptar:
    post:
      tags: [invitaciones]
      operationId: aceptarInvitacion
      summary: Aceptar la invitación con nombre y contraseña (sin email)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AceptarBody" }
      responses:
        "201":
          $ref: "#/components/responses/SesionIniciada"
        "400":
          description: >-
            Cuerpo o nombre no válidos (solicitud_invalida), contraseña fuera de la
            política (contrasena_*) o invitación no vigente (invitacion_invalida,
            mismo mensaje para cualquier causa).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos:
            - solicitud_invalida
            - contrasena_invalida
            - contrasena_corta
            - contrasena_larga
            - contrasena_comun
            - invitacion_invalida
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "429":
          $ref: "#/components/responses/DemasiadasSolicitudes"
        "500":
          description: >-
            La cuenta se creó pero no se pudo emitir la sesión: la persona entra con
            el login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [error_interno]
        "503":
          $ref: "#/components/responses/ServicioNoDisponible"

  /ubicaciones:
    get:
      tags: [catalogo]
      operationId: listarUbicaciones
      summary: Ubicaciones del tenant (el contador recibe solo las activas)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ordenadas por tipo (sede, sala, box) y nombre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaUbicaciones" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [catalogo]
      operationId: crearUbicacion
      summary: Crear una sede, sala o box (solo admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearUbicacionBody" }
      responses:
        "201":
          description: Creada y activa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UbicacionRespuesta" }
        "400":
          description: Cuerpo o nombre no válidos, o tipo y padre que no encajan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, jerarquia_invalida]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: Nombre repetido entre hermanas o padre inactivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [nombre_duplicado, padre_inactivo]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /ubicaciones/{id}:
    patch:
      tags: [catalogo]
      operationId: actualizarUbicacion
      summary: Renombrar, desactivar o reactivar (solo admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActualizarUbicacionBody" }
      responses:
        "200":
          description: Actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UbicacionRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: >-
            Nombre repetido, hijas activas o activos al desactivar (D2 de la spec 004) o
            padre inactivo al reactivar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [nombre_duplicado, tiene_hijas_activas, padre_inactivo, tiene_activos]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /categorias:
    get:
      tags: [catalogo]
      operationId: listarCategorias
      summary: Categorías del tenant, por nombre
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista cerrada de la clínica.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaCategorias" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [catalogo]
      operationId: crearCategoria
      summary: Crear una categoría (solo admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NombreBody" }
      responses:
        "201":
          description: Creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriaRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "409":
          $ref: "#/components/responses/NombreDuplicado"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /categorias/{id}:
    patch:
      tags: [catalogo]
      operationId: renombrarCategoria
      summary: Renombrar una categoría (solo admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NombreBody" }
      responses:
        "200":
          description: Renombrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriaRespuesta" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/NombreDuplicado"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /categorias/sugeridas:
    post:
      tags: [catalogo]
      operationId: cargarCategoriasSugeridas
      summary: Crear las 6 categorías sugeridas que falten (idempotente; solo admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista completa y cuántas se crearon ahora.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SugeridasCargadas" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"

  /activos:
    get:
      tags: [activos]
      operationId: buscarActivos
      summary: Buscar por código, nombre o serial; 25 por página, lo más reciente primero
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { name: estado, in: query, required: false, schema: { $ref: "#/components/schemas/EstadoActivo" } }
        - name: ubicacion_id
          in: query
          required: false
          description: Solo los activos de esa ubicación exacta (spec 005, R10).
          schema: { type: string, format: uuid }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Página de resultados (precio solo para el admin).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaActivos" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
    post:
      tags: [activos]
      operationId: crearActivo
      summary: Dar de alta o duplicar un activo (admin y contador; idempotente por id)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CrearActivoBody"
                - $ref: "#/components/schemas/DuplicarActivoBody"
      responses:
        "200":
          description: Reintento con el mismo id y código; devuelve el ya guardado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "201":
          description: Creado con su evento "creado".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "400":
          description: Cuerpo, código, precio o ubicación no válidos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, codigo_invalido, precio_invalido, ubicacion_invalida]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: El código ya es de otro activo; se devuelve ese activo para abrirlo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodigoExistente" }
          x-codigos: [codigo_existente]
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"

  /activos/sugerencias:
    get:
      tags: [activos]
      operationId: sugerenciasActivos
      summary: Valores ya registrados de un campo, los más usados primero (hasta 8)
      security:
        - bearerAuth: []
      parameters:
        - name: campo
          in: query
          required: true
          schema: { type: string, enum: [nombre, marca, modelo, subtipo] }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 120 } }
      responses:
        "200":
          description: Valores distintos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sugerencias" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"

  /activos/por-codigo:
    get:
      tags: [activos]
      operationId: resolverCodigo
      summary: El activo de un código de sticker (se normaliza a mayúsculas)
      security:
        - bearerAuth: []
      parameters:
        - name: codigo
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Existe en este tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "400":
          description: El texto no tiene el formato de un código.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [codigo_invalido]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /activos/{id}:
    get:
      tags: [activos]
      operationId: fichaActivo
      summary: Ficha de solo lectura de un activo
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: El activo (con precio solo para el admin).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivoRespuesta" }
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      tags: [activos]
      operationId: editarActivo
      summary: Editar un activo (solo admin; cada cambio deja su evento)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditarActivoBody" }
      responses:
        "200":
          $ref: "#/components/responses/ActivoCambiado"
        "400":
          description: Cuerpo o precio no válidos, o se intentó cambiar el código.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, precio_invalido, codigo_inmutable]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ActivoDadoDeBaja"
        "412":
          $ref: "#/components/responses/VersionDesactualizada"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "428":
          $ref: "#/components/responses/FaltaVersion"

  /activos/{id}/historial:
    get:
      tags: [activos]
      operationId: historialActivo
      summary: Línea de tiempo del activo, lo más reciente primero (50 por página)
      description: >-
        Al contador se le omiten los eventos precio_cambiado y toda clave de precio de los
        demás (P13).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: antes_de
          in: query
          required: false
          description: El valor de "siguiente" de la página anterior.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Una página de eventos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Historial" }
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /activos/{id}/mover:
    post:
      tags: [activos]
      operationId: moverActivo
      summary: Mover a otra sala o box activos (solo admin; evento ubicacion_cambiada)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoverActivoBody" }
      responses:
        "200":
          $ref: "#/components/responses/ActivoCambiado"
        "400":
          description: Cuerpo no válido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, ubicacion_invalida]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ActivoDadoDeBaja"
        "412":
          $ref: "#/components/responses/VersionDesactualizada"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "428":
          $ref: "#/components/responses/FaltaVersion"

  /activos/{id}/estado:
    post:
      tags: [activos]
      operationId: cambiarEstadoActivo
      summary: Activo ↔ en reparación, o reactivar un dado de baja con motivo (solo admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstadoActivoBody" }
      responses:
        "200":
          $ref: "#/components/responses/ActivoCambiado"
        "400":
          description: Cuerpo no válido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, motivo_invalido]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/Prohibido"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/ActivoDadoDeBaja"
        "412":
          $ref: "#/components/responses/VersionDesactualizada"
        "413":
          $ref: "#/components/responses/CuerpoDemasiadoGrande"
        "428":
          $ref: "#/components/responses/FaltaVersion"

  /activos/{id}/baja:
    post:
      tags: [activos]
      operationId: darDeBajaActivo
      summary: Dar de baja con motivo (solo admin; evento dado_de_baja)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BajaActivoBody" }
      responses:
        "200":
          $ref: "#/components/responses/ActivoCambiado"
        "400":
          description: Cuerpo no válido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
          x-codigos: [solicitud_invalida, motivo_invalido]
        "401":
