name: CI backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Mientras no exista el proyecto Python, el job termina en verde sin hacer nada.
      - name: Detectar proyecto backend
        id: detect
        run: |
          if [ -f pyproject.toml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Aún no hay backend/pyproject.toml; se omite."; fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        if: steps.detect.outputs.exists == 'true'
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        if: steps.detect.outputs.exists == 'true'
        run: |
          ruff check .
          ruff format --check .

      - name: Migraciones (subir, bajar, subir)
        if: steps.detect.outputs.exists == 'true'
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Pruebas (pytest)
        if: steps.detect.outputs.exists == 'true'
        run: pytest -q
