# Entorno local (spec 001, T7). Las credenciales llegan siempre de .env (${VAR});
# nunca se escriben aquí. Ver .env.example y el README.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    # Solo en la interfaz local: la base no queda expuesta a la red.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      APP_DB_USER: ${APP_DB_USER:?falta APP_DB_USER en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?falta APP_DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Sano solo si PostgreSQL acepta conexiones y el rol de la aplicación existe
    # sin SUPERUSER ni BYPASSRLS (R4c). El nombre del rol va como variable de psql
    # (:'app_user'), no interpolado en el SQL. "$$" deja que lo expanda el contenedor.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          echo "SELECT 1 FROM pg_roles WHERE rolname = :'app_user' AND NOT rolsuper AND NOT rolbypassrls" |
          psql -X -qtA -v ON_ERROR_STOP=1 -v app_user="$$APP_DB_USER" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" |
          grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Dentro del contenedor "localhost" es la propia API: el host de la base es "db".
      # La API usa el rol de la aplicación (sin SUPERUSER ni BYPASSRLS).
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?falta SECRET_KEY en .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    # Código montado para la recarga; el entorno virtual vive en /opt/venv (imagen).
    volumes:
      - ./backend:/app

volumes:
  pgdata:
